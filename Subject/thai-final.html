<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --primary:#4f46e5;--primary2:#7c3aed;--cyan:#06b6d4;--bluebg:#eef2ff;
 --ink:#172554;--muted:#64748b;--bg:#f6f8ff;--white:#fff;--line:#e2e8f0;
 --green:#16a34a;--red:#dc2626;--yellow:#fef3c7;
}
html{scroll-behavior:smooth;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{
 font-family:"Noto Sans Thai","Tahoma",Arial,sans-serif;
 background:linear-gradient(135deg,#f7f8ff 0%,#eef7ff 100%);
 color:var(--ink);line-height:1.7;min-height:100vh
}
header{
 position:fixed;top:0;left:0;right:0;height:72px;z-index:50;
 background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 max(5%,24px);border-bottom:1px solid #e5e7eb;
 box-shadow:0 4px 20px rgba(79,70,229,.08)
}
.logo{font-weight:950;font-size:18px;color:var(--primary);letter-spacing:.2px}
.home-top{width:46px;height:46px;border:0;border-radius:15px;background:#eef2ff;color:#4f46e5;font-size:25px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.12)}
.home-top:hover{transform:translateY(-1px);background:#e0e7ff}
.menu{
 width:50px;height:46px;border:0;border-radius:15px;
 background:linear-gradient(135deg,var(--primary),var(--primary2));
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:5px;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.22)
}
.menu span{width:23px;height:3px;background:white;border-radius:5px}
main{max-width:1050px;margin:auto;padding:108px 5% 65px}
.hero{text-align:center;margin-bottom:25px}
.badge{
 display:inline-flex;align-items:center;padding:7px 17px;border-radius:999px;
 background:#fff7d6;color:#92400e;font-weight:900;font-size:14px;
 box-shadow:0 5px 15px rgba(146,64,14,.08)
}
.hero h1{font-size:clamp(31px,6vw,55px);line-height:1.15;margin:13px 0 7px;font-weight:950}
.hero h1 span{
 background:linear-gradient(90deg,var(--primary),var(--primary2));
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.hero p{color:var(--muted);font-size:15px}
.progress-wrap{max-width:680px;margin:18px auto 0}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress{height:10px;background:#e7eaf4;border-radius:99px;overflow:hidden}
.progress i{
 display:block;height:100%;width:33.3%;
 background:linear-gradient(90deg,var(--primary),var(--cyan));
 border-radius:99px;transition:.35s
}
.page{
 background:rgba(255,255,255,.95);border:1px solid rgba(226,232,240,.9);
 border-radius:28px;padding:30px;box-shadow:0 18px 55px rgba(30,41,59,.09)
}
.topic-head{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.topic-no{
 width:58px;height:58px;min-width:58px;border-radius:18px;display:grid;place-items:center;
 background:linear-gradient(135deg,#e0e7ff,#ede9fe);color:var(--primary);
 font-size:23px;font-weight:950
}
h2{font-size:32px;line-height:1.25;margin:0}
.subtitle{color:var(--primary);font-weight:900;margin:3px 0 18px}
.intro{
 font-size:17px;background:#f8fafc;border-radius:17px;padding:15px 17px;
 border-left:4px solid var(--cyan)
}
h3{
 font-size:20px;color:#3730a3;margin:25px 0 9px;
 display:flex;align-items:center;gap:8px
}
h3:before{content:"";width:7px;height:22px;border-radius:5px;background:linear-gradient(#6366f1,#06b6d4)}
ul{padding-left:25px}
li{font-size:16px;margin:7px 0}
li::marker{color:#6366f1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}
.box{padding:17px;border-radius:18px;background:#f8fafc;border:1px solid #edf0f5}
.box strong{display:block;color:#3730a3;margin-bottom:4px}
.formula{
 font-family:monospace;background:#fff7d6;border:1px solid #fde68a;
 padding:15px;border-radius:15px;margin-top:17px;font-size:17px;white-space:pre-wrap;
 overflow:auto
}
.note{
 margin-top:22px;padding:18px;border-radius:17px;
 background:linear-gradient(135deg,#eff6ff,#f5f3ff);
 border:1px solid #dbeafe;color:#1e3a8a
}
.nav{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px
}
.nav button{
 border:0;border-radius:16px;padding:14px;background:#f1f5ff;color:#3730a3;
 font-weight:900;cursor:pointer;transition:.2s
}
.nav button:hover{transform:translateY(-2px);background:#e0e7ff}
.nav button:last-child{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.nav button:last-child:hover{filter:brightness(1.06)}
.quiz{
 margin-top:25px;padding:20px;border-radius:20px;background:#f8fafc;
 border:1px solid #e2e8f0
}
.quiz h3{margin-top:0}

.q{
 padding:15px;margin:12px 0;background:#fff;border-radius:15px;
 border:1px solid #e5e7eb;box-shadow:0 4px 14px rgba(15,23,42,.04)
}
.q button{
 margin:7px 7px 0 0;border:1px solid #cbd5e1;background:#fff;
 padding:8px 13px;border-radius:11px;cursor:pointer;transition:.15s
}
.q button:hover{background:#eef2ff;border-color:#a5b4fc}
.q button:disabled{cursor:default;opacity:.75}
.answer{display:none;margin-top:10px;font-weight:900}
.search{
 width:100%;padding:12px 15px;border:1px solid #d8dee9;border-radius:14px;
 margin:8px 0 14px;font-size:15px;outline:none
}
.search:focus{border-color:#818cf8;box-shadow:0 0 0 3px #e0e7ff}
.drawer{
 position:fixed;z-index:80;left:0;top:0;width:min(390px,92vw);
 height:100dvh;max-height:100dvh;
 background:rgba(255,255,255,.98);
 padding:22px 22px calc(34px + env(safe-area-inset-bottom));
 transform:translateX(-105%);
 transition:.3s cubic-bezier(.2,.8,.2,1);
 box-shadow:20px 0 55px rgba(15,23,42,.18);
 overflow-y:auto;overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
 overscroll-behavior:contain;
 touch-action:pan-y
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer-head h2{font-size:22px;color:var(--primary);margin:0}
.close{
 width:40px;height:40px;border:0;border-radius:13px;background:#f1f5f9;
 font-size:22px;cursor:pointer
}
.menu-section{
 font-size:12px;color:#94a3b8;font-weight:900;margin:15px 7px 6px;
 text-transform:uppercase;letter-spacing:.5px
}
.topic-btn{
 width:100%;display:flex;align-items:center;gap:11px;text-align:left;
 border:1px solid #edf0f7;background:#fff;color:var(--ink);padding:11px 12px;border-radius:16px;
 margin:6px 0;font-size:14px;cursor:pointer;transition:.18s;
 box-shadow:0 3px 10px rgba(15,23,42,.035)
}
.topic-btn:hover{background:#f8f9ff;transform:translateX(3px);border-color:#c7d2fe;box-shadow:0 7px 16px rgba(79,70,229,.08)}
.topic-btn.active{
 background:linear-gradient(90deg,#eef2ff,#f5f3ff);color:var(--primary);font-weight:950;
 border-color:#a5b4fc;box-shadow:inset 4px 0 0 var(--primary),0 7px 18px rgba(79,70,229,.10)
}
.topic-btn.active{
 outline:2px solid rgba(79,70,229,.18);
 transform:translateX(3px);
}
.topic-btn.active::after{
 content:"";
 margin-left:8px;
 padding:3px 7px;
 border-radius:999px;
 background:#4f46e5;
 color:#fff;
 font-size:10px;
 font-weight:900;
 white-space:nowrap;
}

.topic-btn .topic-num{
 width:34px;height:34px;min-width:34px;border-radius:11px;display:grid;place-items:center;
 background:linear-gradient(135deg,#e0e7ff,#ede9fe);color:#4338ca;font-size:12px;font-weight:950;
 box-shadow:inset 0 0 0 1px rgba(99,102,241,.10)
}
.topic-btn.active .topic-num{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.topic-btn .topic-copy{min-width:0;display:block;line-height:1.35}
.topic-btn .topic-label{display:block;font-size:14px;font-weight:900;color:#172554}
.topic-btn.active .topic-label{color:#3730a3}
.topic-btn .topic-sub{display:block;margin-top:2px;font-size:10.5px;color:#64748b;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-btn .topic-arrow{margin-left:auto;color:#94a3b8;font-size:18px;font-weight:900}
.topic-btn.active .topic-arrow{color:#4f46e5}
#menuList{padding-bottom:18px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:70}
.overlay.show{display:block}
.footer{text-align:center;color:#94a3b8;padding:24px 24px calc(34px + env(safe-area-inset-bottom))}
li strong,.intro strong,.note strong,li b,.intro b,.note b,.sec-card b{color:#3730a3;font-weight:900}
mark{background:linear-gradient(135deg,#fef08a,#fde68a);color:#78350f;padding:1px 6px;border-radius:6px;font-weight:900;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){

}


.quiz-select{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.quiz-select button{border:1px solid #cbd5e1;background:#fff;color:#3730a3;padding:11px 12px;border-radius:12px;font-weight:900;cursor:pointer}
.quiz-select button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}

const menu=document.getElementById("menuList");
function buildMenu(list=topics){
 menu.innerHTML="";
 let lastPart="";
 list.forEach((t)=>{
   const original=topics.indexOf(t);
   const title=t.title.trim();

   // ใช้โครงสร้างหมวดบทแบบเดียวกับวิชาอื่น แต่คงชื่อ Part ของ English ไว้
   let part=title.includes("·") ? title.split("·")[0].trim() : "";
   if(title.toUpperCase().startsWith("MINI QUIZ")) part="Quiz";

   if(part!==lastPart){
     const label=document.createElement("div");
     label.className="menu-section";
     label.textContent=part || "เนื้อหาทั้งหมด";
     menu.appendChild(label);
     lastPart=part;
   }

   const b=document.createElement("button");
   b.className="topic-btn";
   b.dataset.topicIndex=original;

   const cleanTitle=title.includes("·")
     ? title.split("·").slice(1).join("·").trim()
     : title;
   const cleanSub=(t.sub||"").replace(/^[^·]+·\s*/,"").trim();

   b.innerHTML=`<span class="topic-num">${String(original+1).padStart(2,"0")}</span>
   <span class="topic-copy">
     <span class="topic-label">${cleanTitle}</span>
     <span class="topic-sub">${cleanSub}</span>
   </span>
   <span class="topic-arrow">›</span>`;

   b.onclick=()=>{showTopic(original);closeMenu()};
   menu.appendChild(b);
 });
}
buildMenu();

function filterMenu(){
 const q=document.getElementById("search").value.toLowerCase();
 buildMenu(topics.filter(t=>(t.title+" "+t.sub+" "+t.intro).toLowerCase().includes(q)));
}

function showTopic(i){
 const t=topics[i];
 let body="";
 if(t.sections && t.sections.length){
  t.sections.forEach(s=>{
   body+=`<section class="sec-card"><h3>${s[0]}</h3><ul>${s[1].map(x=>`<li>${x}</li>`).join("")}</ul></section>`;
  });
 }
 let quiz="";
 if(i===topics.length-1){
  quiz=`<div class="quiz"><h3>📝 Quiz</h3>
   <div class="quiz-bar" id="quizBar"><button type="button" class="qb-reset" onclick="resetQuiz()">↺ ทำใหม่</button><div class="qb-score" id="qbScore"><small>คะแนน</small><b>– / –</b></div></div><button type="button" id="quizPickBtn" class="quiz-pick-btn" onclick="openQuizPicker(event)">
      <span class="qp-ico" id="qpIco">🎯</span>
      <span class="qp-txt"><span class="qp-lab">📚 เลือกบทฝึก</span><span class="qp-cur" id="qpCur">—</span><span class="qp-sub" id="qpSub"></span></span>
      <span class="qp-go">เลือกบท ▾</span>
    </button><div id="quizArea"></div>
   <p class="small">หมายเหตุ: คำถามอ้างอิงจากเนื้อหาที่สรุปไว้ในแต่ละบท</p></div>`;
 }
 document.getElementById("page").innerHTML=`
  <div class="topic-head">
   <div class="topic-no">${i+1}</div>
   <div><h2>${t.title}</h2>
   ${t.sub?`<div class="subtitle">${t.sub}</div>`:""}</div>
  </div>
  ${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${body}
  ${t.note?`<div class="note"><b>⭐ จุดที่ควรจำ</b><br>${t.note}</div>`:""}
  ${quiz}
  <div class="nav">
   <button onclick="showTopic(${i-1})" ${i===0?"disabled":""}>← บทก่อนหน้า</button>
   <button onclick="showTopic(${i+1})" ${i===topics.length-1?"disabled":""}>บทถัดไป →</button>
  </div>`;
 if(i===topics.length-1) renderQuiz(quizBanks.length-1);
 document.querySelectorAll(".topic-btn").forEach((b,n)=>{
  b.classList.toggle("active",n===i);
 });
 document.getElementById("progress").style.width=((i+1)/topics.length*100)+"%";
 document.getElementById("progressText").textContent="บท "+(i+1)+" / "+topics.length;
 window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuiz(bankIndex){
 const bank=quizBanks[bankIndex];
 if(!bank) return;
 qzCurrent=bankIndex;
 qzSubmitted=false;
 const curEl=document.getElementById("qpCur");
 if(curEl) curEl.textContent=String(bank.label).replace(/^\d+\.\s*/,"");
 const subEl=document.getElementById("qpSub");
 if(subEl) subEl.textContent=bank.questions.length+" ข้อ · "+(bankIndex===quizBanks.length-1?"ทบทวนรวม":"ฝึกเฉพาะบท");
 const icoEl=document.getElementById("qpIco");
 if(icoEl) icoEl.textContent=qzIcon(bankIndex);
 const area=document.getElementById("quizArea");
 if(!area) return;
 const L=["A","B","C","D"];
 area.innerHTML=bank.questions.map((q,n)=>`
  <div class="q" data-i="${n}" data-correct="${q[5]}">
   <b>${n+1}) ${q[0]}</b>
   ${L.map((l,k)=>`<button type="button" class="opt" data-l="${l}" onclick="pickAnswer(this)">${l}. ${q[k+1]}</button>`).join("")}
   <div class="answer"></div>
  </div>`).join("")+`
  <div class="quiz-submit-wrap">
   <div class="quiz-note" id="quizNote"></div>
   <button type="button" class="qb-submit" id="qbSubmit" onclick="submitQuiz()">ส่งคำตอบ</button>
  </div>`;
 qzUpdateBar();
}
function pickAnswer(btn){
 if(qzSubmitted) return;
 const box=btn.closest(".q");
 box.classList.remove("unanswered");
 box.querySelectorAll(".opt").forEach(b=>b.classList.remove("picked"));
 btn.classList.add("picked");
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzUpdateBar();
}
function qzUpdateBar(){
 const area=document.getElementById("quizArea"); if(!area) return;
 const total=area.querySelectorAll(".q").length;
 const answered=area.querySelectorAll(".opt.picked").length;
 const sub=document.getElementById("qbSubmit");
 const sc=document.getElementById("qbScore");
 if(qzSubmitted) return;
 if(sub) sub.disabled=false;
 if(sc){
  sc.className="qb-score";
  sc.innerHTML='<small>ตอบแล้ว</small><b>'+answered+' / '+total+'</b>';
 }
}
function submitQuiz(){
 if(qzSubmitted) return;
 const area=document.getElementById("quizArea"); if(!area) return;
 const qs=[...area.querySelectorAll(".q")];
 const missing=qs.filter(q=>!q.querySelector(".opt.picked"));
 if(missing.length){
  qs.forEach(q=>q.classList.toggle("unanswered",!q.querySelector(".opt.picked")));
  const note=document.getElementById("quizNote");
  if(note){ note.textContent="ยังไม่ได้ตอบอีก "+missing.length+" ข้อ (ข้อ "+missing.map(q=>+q.dataset.i+1).join(", ")+") — ตอบให้ครบก่อนส่งนะ"; note.classList.add("show"); }
  missing[0].scrollIntoView({behavior:"smooth",block:"center"});
  return;
 }
 qzSubmitted=true;
 let score=0;
 qs.forEach(q=>{
  const correct=q.dataset.correct;
  const picked=q.querySelector(".opt.picked");
  const letter=picked.dataset.l;
  const ok=letter===correct;
  if(ok) score++;
  q.classList.add(ok?"is-right":"is-wrong");
  q.querySelectorAll(".opt").forEach(b=>{
   b.disabled=true;
   b.classList.remove("picked");
   if(b.dataset.l===correct) b.classList.add("right");
   else if(b===picked) b.classList.add("wrong");
  });
  const ans=q.querySelector(".answer");
  ans.style.display="block";
  ans.textContent=ok?"✅ ถูกต้อง!":"❌ ยังไม่ถูก — เฉลยคือ "+correct;
  ans.style.color=ok?"#15803d":"#dc2626";
 });
 const total=qs.length;
 const sc=document.getElementById("qbScore");
 if(sc){
  sc.className="qb-score "+(score/total>=0.5?"done":"low");
  sc.innerHTML='<small>คะแนน</small><b>'+score+' / '+total+'</b>';
 }
 const sub=document.getElementById("qbSubmit"); if(sub) sub.disabled=true;
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function qzScrollTo(id){
 const el=document.getElementById(id); if(!el) return;
 const y=el.getBoundingClientRect().top+window.pageYOffset-84;
 window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
}
function resetQuiz(){
 if(qzCurrent===null) return;
 renderQuiz(qzCurrent);
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function goHomeFromSubject(){ try { if(window.parent && window.parent !== window && typeof window.parent.goHome === "function"){ window.parent.goHome(); return; } } catch(e){} window.location.href = location.protocol==="file:" ? "index.html" : "/home"; }
function openMenu(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}

/* ===== Quiz chapter popup (shared) ===== */
let qzCurrent=null;
let qzSubmitted=false;
let qzByKey=false;
function qzIcon(n){
  const last=quizBanks.length-1;
  if(n===last) return "🎯";
  const pool=(typeof quizIcons!=="undefined"&&quizIcons)||["📘","📗","📙","📕","📒","📓","📔"];
  return pool[n%pool.length];
}
function qzEnsureModal(){
  let m=document.getElementById("qzModal");
  if(m) return m;
  m=document.createElement("div");
  m.id="qzModal";
  m.setAttribute("role","dialog");
  m.setAttribute("aria-modal","true");
  m.setAttribute("aria-labelledby","qzTitle");
  m.innerHTML=`<div class="qz-back" onclick="closeQuizPicker()"></div>
   <div class="qz-box">
    <div class="qz-head">
      <div class="qz-head-ico">📝</div>
      <div><h4 id="qzTitle">📚 เลือกบทที่จะฝึก</h4><small>แตะบทที่ต้องการ แล้วโจทย์จะขึ้นให้ทันที</small></div>
      <button type="button" class="qz-x" aria-label="ปิด" onclick="closeQuizPicker()">×</button>
    </div>
    <div class="qz-list" id="qzList"></div>
   </div>`;
  document.body.appendChild(m);
  return m;
}
function openQuizPicker(ev){
  qzByKey=!!(ev&&ev.detail===0);
  const m=qzEnsureModal();
  const last=quizBanks.length-1;
  document.getElementById("qzList").innerHTML=quizBanks.map((b,n)=>{
    const isAll=n===last;
    const name=String(b.label).replace(/^\d+\.\s*/,"");
    return `<button type="button" class="qz-item${isAll?" all":""}${n===qzCurrent?" active":""}" onclick="pickQuiz(${n})">
      <span class="qz-i">${qzIcon(n)}</span>
      <span class="qz-t"><span class="qz-n">${name}</span><span class="qz-c">${b.questions.length} ข้อ · ${isAll?"ทบทวนรวม":"ฝึกเฉพาะบท"}</span></span>
      <span class="qz-ok">✓</span>
    </button>`;
  }).join("");
  m.classList.add("show");
  document.body.classList.add("qz-lock"); document.documentElement.classList.add("qz-lock");
  const act=m.querySelector(".qz-item.active")||m.querySelector(".qz-item");
  if(act){ act.focus({preventScroll:true}); act.scrollIntoView({block:"nearest"}); }
}
function closeQuizPicker(){
  const m=document.getElementById("qzModal");
  if(m) m.classList.remove("show");
  document.body.classList.remove("qz-lock"); document.documentElement.classList.remove("qz-lock");
  const b=document.getElementById("quizPickBtn"); if(b&&qzByKey) b.focus({preventScroll:true});
  qzByKey=false;
}
function pickQuiz(n){
  renderQuiz(n);
  closeQuizPicker();
  const a=document.getElementById("quizArea");
  if(a) setTimeout(()=>a.scrollIntoView({behavior:"smooth",block:"start"}),60);
}



/* keep wheel / touch scrolling working inside the popup, never on the page behind */
document.addEventListener("wheel",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList");
  if(list && list.contains(e.target)) return;      // native scroll inside the list
  e.preventDefault();
  if(list) list.scrollTop += e.deltaY;              // wheel on backdrop/header -> scroll the list
},{passive:false});
document.addEventListener("keydown",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList"); if(!list) return;
  const step={ArrowDown:60,ArrowUp:-60,PageDown:list.clientHeight*0.9,PageUp:-list.clientHeight*0.9}[e.key];
  if(step!==undefined){ e.preventDefault(); list.scrollTop+=step; }
  else if(e.key==="Home"){ e.preventDefault(); list.scrollTop=0; }
  else if(e.key==="End"){ e.preventDefault(); list.scrollTop=list.scrollHeight; }
});

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=document.getElementById("qzModal"); if(m&&m.classList.contains("show")) closeQuizPicker(); }});

showTopic(0);
</script>
