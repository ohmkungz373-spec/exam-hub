h2{font-size:32px;line-height:1.25;margin:0}
.subtitle{color:var(--primary);font-weight:900;margin:3px 0 18px}
.intro{

h3:before{content:"";width:7px;height:22px;border-radius:5px;background:linear-gradient(#6366f1,#06b6d4)}
ul{padding-left:25px}
li{font-size:16px;margin:7px 0}
li::marker{color:#6366f1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}
.box{padding:17px;border-radius:18px;background:#f8fafc;border:1px solid #edf0f5}

.formula{

 padding:15px;border-radius:15px;margin-top:17px;font-size:17px;white-space:pre-wrap;
 overflow:auto
}
.note{
 margin-top:22px;padding:18px;border-radius:17px;
 background:linear-gradient(135deg,#eff6ff,#f5f3ff);
 border:1px solid #dbeafe;color:#1e3a8a
}
.nav{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px
}
.nav button{
 border:0;border-radius:16px;padding:14px;background:#f1f5ff;color:#3730a3;
 font-weight:900;cursor:pointer;transition:.2s
}
.nav button:hover{transform:translateY(-2px);background:#e0e7ff}
.nav button:last-child{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}

.quiz{

 border:1px solid #e2e8f0
}
.quiz h3{margin-top:0}
/* ปุ่มกลับหน้าหลักอยู่ข้างแถบนำทางของเว็บวิชา */
.page-view-head{
  position:fixed;
  top:0;
  left:0;
  z-index:100;
  background:transparent;
  border:0;
  padding:10px 0 0 12px;
  pointer-events:none;
}
.page-view-head-in{
  padding:0;
}
.page-view .home-btn{
  pointer-events:auto;
  box-shadow:0 5px 18px rgba(16,24,40,.12);
}
.page-view iframe{
  height:100vh;
  min-height:760px;
}


/* Quiz — ตัวเลือกบทแบบการ์ด */
.quiz-select{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 20px
}
.quiz-select button{
 position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:68px;
 padding:12px 14px;border:1px solid #e2e8f0;border-radius:17px;background:#fff;
 color:#172554;text-align:left;font:inherit;font-weight:800;cursor:pointer;
 box-shadow:0 4px 14px rgba(15,23,42,.04);transition:transform .18s,box-shadow .18s,border-color .18s,background .18s
}
.quiz-select button:hover{transform:translateY(-2px);border-color:#a5b4fc;box-shadow:0 8px 20px rgba(15,23,42,.08);background:#fafaff}
.quiz-select button.active{border-color:#4f46e5;background:linear-gradient(135deg,#eef2ff,#f5f3ff);box-shadow:0 0 0 2px rgba(79,70,229,.10),0 8px 20px rgba(79,70,229,.10);color:#3730a3}
.quiz-select button .quiz-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;background:#f1f5f9;font-size:18px}
.quiz-select button.active .quiz-icon{background:#e0e7ff}
.quiz-select button .quiz-copy{min-width:0;display:block}
.quiz-select button .quiz-name{display:block;font-size:14px;line-height:1.35}
.quiz-select button .quiz-count{display:block;margin-top:3px;font-size:11px;color:#64748b;font-weight:600}
.quiz-select button .quiz-check{margin-left:auto;font-size:18px;opacity:0;transform:scale(.8);transition:.18s}
.quiz-select button.active .quiz-check{opacity:1;transform:scale(1)}
.quiz-start{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:14px;background:#fff;border:1px dashed #cbd5e1;color:#475569;font-size:13px}

.q{
 padding:15px;margin:12px 0;background:#fff;border-radius:15px;

.q button{

.q button:hover{background:#eef2ff;border-color:#a5b4fc}

.answer{display:none;margin-top:10px;font-weight:900}

.topic-btn .topic-sub{display:block;margin-top:2px;font-size:10.5px;color:#64748b;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

li strong,.intro strong,.note strong,li b,.intro b,.note b,.sec-card b{color:#3730a3;font-weight:900}

const topics=[{"title": "Unit 4 · Vocabulary (Reading 1)", "sub": "6 คำ · Education Abroad", "intro": "คำศัพท์สำคัญจาก Reading <strong>1 เรื่อง</strong> Education Abroad: Should I Stay or Should I Go? ใช้บ่อยในข้อสอบตอนคำศัพท์และแปลความ", "sections": [["Vocabulary Set", ["<strong>adolescent (n./adj.)</strong> = วัยรุ่น, เกี่ยวกับวัยรุ่น", "<strong>undergraduate (n./adj.)</strong> = นักศึกษาระดับปริญญาตรี", "<strong>statistically (adv.)</strong> = ในทางสถิติ, ตามหลักสถิติ", "<strong>bilingual (adj./n.)</strong> = สองภาษา, ผู้ที่พูดได้สองภาษา", "<strong>curriculum (n.)</strong> = หลักสูตร", "<strong>aspect (n.)</strong> = แง่มุม, ด้าน, ลักษณะ"]], ["Extra Vocabulary", ["<strong>flexible (adj.)</strong> = ยืดหยุ่น, ปรับเปลี่ยนได้", "<strong>guarantee (v.)</strong> = รับประกัน, รับรอง", "<strong>homesickness (n.)</strong> = ความคิดถึงบ้าน", "<strong>worthwhile (adj.)</strong> = คุ้มค่า, มีประโยชน์", "<strong>exclusive (adj.)</strong> = เฉพาะ, จำกัดเฉพาะกลุ่ม", "<strong>independent (adj.)</strong> = เป็นอิสระ, พึ่งพาตนเอง", "<strong>debt (n.)</strong> = หนี้, หนี้สิน", "<strong>adapt (v.)</strong> = ปรับตัว, ปรับเปลี่ยน", "<strong>domestic (adj.)</strong> = ภายในประเทศ, ในประเทศ"]]], "note": "<strong>จำคู่ตรงข้าม</strong>: domestic (ในประเทศ) ⟷ international/abroad (ต่างประเทศ)"}, {"title": "Unit 4 · Reading 1", "sub": "Education Abroad: Should I Stay or Should I Go?", "intro": "บทความเปรียบเทียบข้อดี-ข้อเสียของการไปศึกษาต่อต่างประเทศ ทั้งระดับวัยรุ่น (boarding school) และระดับมหาวิทยาลัย", "sections": [["ประเด็นหลักของบทความ", ["<strong>โรงเรียนประจำ (boarding school)</strong>: มีชื่อเสียง สิ่งอำนวยความสะดวกดี แต่ค่าใช้จ่ายสูง นักเรียนมักคิดถึงบ้าน (homesickness) และมักเป็นสังคมปิดเฉพาะกลุ่ม (exclusive)", "<strong>ระดับมหาวิทยาลัย</strong>: พบได้ทั่วไปมากกว่า ปี 2019 มีนักศึกษาต่างชาติกว่า 1 ล้านคนในสหรัฐฯ (จีนมากสุด 369,548 คน อินเดีย 202,014 คน) สร้างมูลค่าเศรษฐกิจเกือบ 44,000 ล้านดอลลาร์", "<strong>ข้อดี</strong>: ได้สัมผัสสังคมหลากหลาย พึ่งพาตนเองได้ (independent) มั่นใจ มีแรงจูงใจ ในแอฟริกา 65% ของ CEO เคยเรียนต่างประเทศ ในเอเชีย 29%", "<strong>ข้อเสีย</strong>: ค่าใช้จ่ายสูง (~$40,000/ปี) หนี้สินก้อนโต (debt) ปรับตัว (adapt) ยากกับหลักสูตร (curriculum) และวัฒนธรรมใหม่", "<strong>Brain drain</strong>: นักศึกษาที่ไปเรียนต่างประเทศมักไม่กลับบ้านเกิด ทักษะจึงถูกใช้ในประเทศเจ้าบ้านแทน (เช่น อินเดียเริ่ม 13.4% ของ tech start-up ใน Silicon Valley ปี 2006)", "<strong>สรุป</strong>: การศึกษาในประเทศ (domestic) ถูกกว่า สร้างชุมชน เตรียมพร้อมชีวิตจริง ส่วนการศึกษาต่างประเทศเปิดโลกทัศน์และโอกาสงานที่ดีกว่า"]]], "note": "<strong>คำถามที่มักออกสอบ</strong>: สาเหตุ/ผลกระทบของ brain drain, ข้อดี-ข้อเสียของการเรียนต่างประเทศ, ตัวเลขสถิตินักศึกษาต่างชาติในสหรัฐฯ"}, {"title": "Unit 4 · Vocabulary (Reading 2)", "sub": "6 คำ · Education under COVID-19", "intro": "คำศัพท์สำคัญจาก Reading <strong>2 เรื่อง</strong> Closed Doors: Education under COVID-19", "sections": [["Vocabulary Set", ["<strong>generalize (v.)</strong> = สรุปโดยทั่วไป, เหมารวม", "<strong>closure (n.)</strong> = การปิด, การยุติ, การสิ้นสุด", "<strong>occupation (n.)</strong> = อาชีพ, งาน", "<strong>behavioral (adj.)</strong> = เกี่ยวกับพฤติกรรม", "<strong>innate (adj.)</strong> = ติดตัวมาแต่กำเนิด, โดยกำเนิด", "<strong>continuity (n.)</strong> = ความต่อเนื่อง"]], ["Extra Vocabulary", ["<strong>substitute (n.)</strong> = สิ่งทดแทน, ตัวแทน", "<strong>maintain (v.)</strong> = รักษา, คงไว้, ดำรงไว้", "<strong>feasible (adj.)</strong> = เป็นไปได้, สามารถทำได้", "<strong>virus (n.)</strong> = ไวรัส", "<strong>crucial (adj.)</strong> = สำคัญอย่างยิ่ง, จำเป็นอย่างมาก", "<strong>define (v.)</strong> = นิยาม, ให้คำจำกัดความ", "<strong>professional (n.)</strong> = ผู้เชี่ยวชาญ, ผู้ประกอบวิชาชีพ", "<strong>nutrition (n.)</strong> = โภชนาการ", "<strong>intellectual (adj.)</strong> = เกี่ยวกับสติปัญญา, ทางความคิด", "<strong>cycle (n.)</strong> = วงจร, รอบ"]]], "note": "<strong>จำคู่ตรงข้าม</strong>: feasible (เป็นไปได้) ⟷ not feasible/impossible (เป็นไปไม่ได้)"}, {"title": "Unit 4 · Reading 2", "sub": "Closed Doors: Education under COVID-19", "intro": "บทความเกี่ยวกับผลกระทบของการปิดโรงเรียนช่วง COVID-19 ต่อการศึกษาของเด็กทั่วโลก", "sections": [["ประเด็นหลักของบทความ", ["ปี 2020 มีเด็กประมาณ <strong>1.6 พันล้าน</strong>คนทั่วโลกได้รับผลกระทบจากการปิดโรงเรียน (school closures)", "ครอบครัว white-collar ที่ work from home ได้ สามารถ homeschool ลูกและรักษาความต่อเนื่อง (continuity) ทางการศึกษาได้", "ครอบครัว blue-collar (คนขับรถ โรงงาน ก่อสร้าง สาธารณสุข) homeschool ไม่เป็นไปได้ (not feasible) ต้องออกไปทำงาน บางประเทศให้ลูกของ <mark>'key worker'</mark> เข้าเรียนได้", "Remote learning (Zoom, Google Classroom) ช่วยได้บางส่วน แต่เด็กที่ไม่มีคอมพิวเตอร์หรือห้องสมุดปิด ก็เสียเปรียบ", "โรงเรียนสำคัญต่อพัฒนาการด้านพฤติกรรม (behavioral) การเข้าสังคม และเด็กยากจนที่พึ่งอาหารกลางวันฟรี ก็ขาดโภชนาการ (nutrition)", "<strong>ผลระยะยาว</strong>: เด็กที่เสียเปรียบโดยกำเนิด (innate disadvantage) อาจล้าหลังมากขึ้น เกิดเป็นวงจร (cycle) ของความเสียเปรียบต่อไป"]]], "note": "<strong>คำถามที่มักออกสอบ</strong>: ความแตกต่างระหว่างครอบครัว white-collar กับ blue-collar ในการรับมือ COVID-19, ผลกระทบระยะยาวต่อเด็กด้อยโอกาส"}, {"title": "Grammar · Article", "sub": "a / an / the / Zero Article", "intro": "Article คือคำที่วางหน้าคำนามเพื่อบอกว่าเป็นสิ่งใด จำนวนเท่าไร หรือเป็นสิ่งที่ผู้พูดและผู้ฟังรู้จักหรือไม่", "sections": [["ประเภทของ Article", ["<strong>Indefinite Articles</strong>: a, an (ใช้กับคำนามนับได้ เอกพจน์ ที่ยังไม่เจาะจง)", "<strong>Definite Article</strong>: the (ใช้กับคำนามที่ผู้พูดและผู้ฟังรู้จักแล้ว)", "<strong>Zero Article (Ø)</strong>: ไม่ใช้ article เลย (เช่น หน้าคำนามนับไม่ได้ หรือพหูพจน์แบบทั่วไป)"]], ["การใช้ a / an", ["a ใช้หน้าคำที่ขึ้นต้นด้วยเสียงพยัญชนะ เช่น a book, a teacher, a dog", "an ใช้หน้าคำที่ขึ้นต้นด้วยเสียงสระ เช่น an apple, an elephant, an umbrella"]]], "formula": "a/an + คำนามนับได้ เอกพจน์ (พิจารณาจาก 'เสียง' ไม่ใช่ตัวอักษร)\nthe + คำนามที่เจาะจง/รู้จักแล้ว", "note": "<strong>ข้อสังเกต</strong>: 'an hour' ใช้ an เพราะ h ไม่ออกเสียง ส่วน 'a university' ใช้ a เพราะออกเสียง /j/ ขึ้นต้น"}, {"title": "Grammar · Quantifiers", "sub": "many / much / some / any / a few / a little", "intro": "Quantifiers คือคำบอกปริมาณ ใช้วางหน้าคำนามเพื่อบอกว่า <mark>'มีมากน้อยแค่ไหน'</mark> โดยไม่จำเป็นต้องระบุจำนวนที่แน่นอน", "sections": [["Countable Nouns (คำนามนับได้)", ["<strong>ลักษณะสำคัญ</strong>: ใช้ a/an ได้เมื่อเป็นเอกพจน์, เติม -s/-es เมื่อเป็นพหูพจน์, ใช้กับตัวเลขได้", "<strong>Quantifiers ที่ใช้ได้</strong>: many, a few, few, several, a number of, each, every, either/neither", "<strong>ตัวอย่าง</strong>: I have a book. / She bought three books. / There are five students in the room."]], ["Uncountable Nouns (คำนามนับไม่ได้)", ["ส่วนใหญ่ได้แก่ ของเหลว ผง แก๊ส แนวคิด ความรู้สึก ข้อมูล สิ่งที่เป็นมวลรวม", "<strong>ลักษณะสำคัญ</strong>: ไม่ใช้ a/an, ไม่มีรูปพหูพจน์", "<strong>Quantifiers ที่ใช้ได้</strong>: much, a little, little, a bit of, a great deal of, an amount of", "<strong>ตัวอย่าง</strong>: I need water. / She gave me advice. / We don't have much money. / There is little sugar left."]], ["Quantifiers ที่ใช้ได้ทั้งสองแบบ", ["some, any, a lot of, lots of, plenty of, enough, all, most", "<strong>ตัวอย่าง</strong>: some books (นับได้) / some water (นับไม่ได้)"]]], "formula": "Countable: many, a few, few, several, a number of\nทั้งสอง: some, any, a lot of, lots of, plenty of, enough, all, most\nUncountable: much, a little, little, a bit of, a great deal of", "note": "<strong>หลักจำง่าย</strong>: many/few ใช้กับนามนับได้ (นับเป็นตัวเลขได้), much/little ใช้กับนามนับไม่ได้ (วัดเป็นปริมาณ)"}, {"title": "Unit 3 · Vocabulary (Reading 1)", "sub": "6 คำ · Obesity", "intro": "คำศัพท์สำคัญจาก Reading <strong>1 เรื่อง</strong> Obesity (โรคอ้วน) และการวัด BMI", "sections": [["Vocabulary Set", ["<strong>diagnose (v.)</strong> = วินิจฉัย (โรคหรืออาการ)", "<strong>gauge (v.)</strong> = ประเมิน, วัด, กะประมาณ", "<strong>thickness (n.)</strong> = ความหนา", "<strong>crude (adj.)</strong> = หยาบ, คร่าวๆ, ไม่ละเอียด, ไม่แม่นยำ", "<strong>calculator (n.)</strong> = เครื่องคิดเลข", "<strong>plug into (phrasal verb)</strong> = นำข้อมูลใส่ลงใน (สูตร/โปรแกรม/สมการ) เพื่อคำนวณ"]], ["Extra Vocabulary", ["<strong>precise (adj.)</strong> = แม่นยำ, เที่ยงตรง, ละเอียดถูกต้อง", "<strong>estimate (v.)</strong> = ประมาณการ, คาดคะเน, ประเมิน", "<strong>composition (n.)</strong> = องค์ประกอบ, ส่วนประกอบที่รวมกันเป็นสิ่งหนึ่ง", "<strong>method (n.)</strong> = วิธีการ, วิธีดำเนินการ", "<strong>squeeze (v.)</strong> = บีบ, กด, บีบอัด", "<strong>formula (n.)</strong> = สูตร, สมการ (โดยเฉพาะทางคณิตศาสตร์หรือวิทยาศาสตร์)", "<strong>density (n.)</strong> = ความหนาแน่น (ปริมาณของสสารเมื่อเทียบกับขนาดหรือปริมาตรของสิ่งนั้น)"]]], "note": "<strong>จำคำคู่</strong>: diagnose (วินิจฉัย) มักใช้กับ condition/disease ส่วน gauge/estimate ใช้กับการวัด/ประมาณค่า"}, {"title": "Unit 3 · Reading 1", "sub": "Obesity & BMI", "intro": "บทความอธิบายว่าโรคอ้วนคืออะไร และวิธีวัดโดยใช้ Body Mass Index (BMI)", "sections": [["ประเด็นหลักของบทความ", ["Obese หมายถึงมีไขมันในร่างกายมากเกินไปจนเสี่ยงเกิดปัญหาสุขภาพ ราว <strong>42%</strong> ของคนในสหรัฐฯ เป็นโรคอ้วน", "คนที่ดูอ้วนเล็กน้อยก็อาจถูกวินิจฉัย (diagnosed) ว่าเป็นโรคอ้วนได้ ถ้ามีไขมันเกิน ~<strong>40%</strong> ของร่างกาย (composition)", "<strong>วิธีวัดแบบพื้นฐาน</strong>: บีบไขมันที่ต้นแขน วัดความหนา (thickness) แล้วใส่ตัวเลขลงในสูตร (plug into a formula) แต่เป็นการประมาณแบบหยาบ (crude estimate)", "<strong>BMI</strong> = น้ำหนัก(กก.) ÷ ส่วนสูง²(เมตร) ค่าปกติของผู้ใหญ่ที่แข็งแรงอยู่ระหว่าง 20-25 ถ้า BMI ≥30 ถือว่าอ้วน", "<strong>ข้อจำกัดของ BMI</strong>: ไม่บอกสัดส่วนไขมันจริง ไม่แม่นยำกับนักกีฬา (กล้ามเนื้อหนักกว่าไขมัน) คนที่มีความหนาแน่นกระดูก (bone density) สูง เด็ก หรือผู้สูงอายุ", "<strong>ข้อดีของ BMI</strong>: ใช้ง่าย ไม่ต้องใช้อุปกรณ์พิเศษ (แค่เครื่องชั่งกับเครื่องคิดเลข) และช่วยระบุความเสี่ยงต่อสุขภาพได้ในระดับหนึ่ง"]]], "formula": "BMI = weight (kg) ÷ height² (m)\nปกติ: 20-25 | อ้วน: ≥30", "note": "<strong>คำถามที่มักออกสอบ</strong>: สูตร BMI, ข้อจำกัดของ BMI กับนักกีฬา/เด็ก/ผู้สูงอายุ, ความหมายของคำว่า obese"}, {"title": "Unit 3 · Vocabulary (Reading 2)", "sub": "6 คำ · Studying Headaches", "intro": "คำศัพท์สำคัญจาก Reading <strong>2 เรื่อง</strong> Studying Headaches (การศึกษาอาการปวดหัว)", "sections": [["Vocabulary Set", ["<strong>tumor (n.)</strong> = เนื้องอก, ก้อนเนื้อ (อาจเป็นเนื้องอกธรรมดาหรือมะเร็งก็ได้)", "<strong>chemistry (n.)</strong> = เคมี; วิชาเคมี; หรือองค์ประกอบ/ปฏิกิริยาทางเคมี (ขึ้นอยู่กับบริบท)", "<strong>acid (n.)</strong> = กรด", "<strong>physiological (adj.)</strong> = ที่เกี่ยวข้องกับสรีรวิทยา หรือการทำงานของร่างกาย", "<strong>productivity (n.)</strong> = ประสิทธิภาพในการทำงาน, ผลผลิต, ความสามารถในการผลิต", "<strong>stimulus (พหูพจน์: stimuli) (n.)</strong> = สิ่งกระตุ้น, ตัวกระตุ้น, สิ่งเร้าที่ทำให้เกิดการตอบสนอง"]], ["Extra Vocabulary", ["<strong>severe headache (adj.)</strong> = อาการปวดศีรษะอย่างรุนแรง", "<strong>Hippocrates (n.)</strong> = ฮิปโปเครตีส ผู้บุกเบิกการศึกษาทางการแพทย์", "<strong>bark of a willow tree (n.)</strong> = เปลือกของต้นหลิว", "<strong>aspirin (n.)</strong> = ยาแอสไพริน", "<strong>classify headaches (v.)</strong> = จำแนกประเภทของอาการปวดศีรษะ", "<strong>muscle tension (n.)</strong> = ความตึงเครียดของกล้ามเนื้อ", "<strong>characteristically (adv.)</strong> = โดยทั่วไปแล้ว / โดยลักษณะเฉพาะ", "<strong>trigger a migraine (v.)</strong> = กระตุ้นให้เกิดอาการไมเกรน", "<strong>vomit (v.)</strong> = อาเจียน"]]], "note": "<strong>จำคำคู่</strong>: tumor (เนื้องอก) เป็นสาเหตุของ secondary headache ส่วน tension/migraine/cluster เป็น primary headache"}, {"title": "Unit 3 · Reading 2", "sub": "Studying Headaches", "intro": "บทความเกี่ยวกับประวัติการรักษาอาการปวดหัว และประเภทต่างๆ ของอาการปวดหัว", "sections": [["ประเด็นหลักของบทความ", ["ปวดหัวเป็นปัญหาใหญ่ ทำให้เสียค่าใช้จ่ายรวมกว่า <strong>50,000 ล้าน</strong>ดอลลาร์ต่อปีทั่วโลก ส่งผลต่อ productivity ในที่ทำงาน", "Hippocrates (<strong>400 ปี</strong>ก่อนคริสตกาล) เป็นแพทย์คนแรกที่พบวิธีรักษา โดยใช้ผงจากเปลือกต้นหลิว (bark of willow tree) ที่มีสาร salicin", "สาร salicin เปลี่ยนเป็น salicylic acid ในร่างกาย ช่วยหยุดปวดแต่ไม่ดีต่อกระเพาะ ในศตวรรษที่ 1800 นักเคมีชาวเยอรมันปรับสูตรเป็น acetylsalicylic acid หรือ aspirin", "<strong>ปวดหัวแบ่งเป็น 2 ประเภทหลัก</strong>: Primary (ปวดหัวเองล้วนๆ) และ Secondary (เกิดจากภาวะทาง physiological อื่น เช่น การติดเชื้อหรือ tumor)", "<strong>Primary มี 3 ชนิด</strong>: (1) Tension headache จากความเครียด/muscle tension ปวดตื้อทั้งสองข้าง (2) Migraine จากการเปลี่ยนแปลง chemistry ในสมอง กระตุ้น (trigger) ได้จากการนอนไม่พอหรืออาหาร/กลิ่นบางชนิด ปวดรุนแรงข้างเดียว อาจ vomit (3) Cluster headache เกิดเวลาเดิมซ้ำๆ ปวดรอบดวงตาข้างเดียว พบมากในผู้ชาย", "ปัจจุบันแพทย์ใช้คอมพิวเตอร์และอุปกรณ์การแพทย์ทันสมัยศึกษาสมองก่อน/ระหว่างปวดหัว หวังหาวิธีหยุดอาการได้ก่อนเกิด"]]], "note": "<strong>คำถามที่มักออกสอบ</strong>: ความแตกต่างระหว่าง primary กับ secondary headache, ที่มาของ aspirin, ลักษณะเฉพาะของ tension/migraine/cluster headache"}, {"title": "MINI QUIZ · Quiz", "sub": "", "intro": "", "sections": []}];

const quizBanks=[{"label": "1. Unit 4 Vocabulary", "questions": [["'bilingual' หมายความว่าอย่างไร?", "พูดได้สองภาษา", "เรียนสองวิชา", "อยู่สองประเทศ", "มีสองปริญญา", "A"], ["'debt' หมายความว่าอย่างไร?", "หนี้สิน", "ทุนการศึกษา", "ทุนสำรอง", "รายได้", "A"], ["'domestic education' หมายถึงอะไร?", "การศึกษาในประเทศ", "การศึกษาต่างประเทศ", "การศึกษาออนไลน์", "การศึกษาภาคค่ำ", "A"], ["'brain drain' ในบทความหมายถึงอะไร?", "คนเก่งไม่กลับประเทศหลังไปเรียนต่างประเทศ", "สมองเสื่อมจากการเรียนหนัก", "การขาดแคลนครู", "การลาออกจากงาน", "A"], ["'homesickness' หมายความว่าอย่างไร?", "คิดถึงบ้าน", "ป่วยที่บ้าน", "ไม่มีที่อยู่", "แพ้อากาศ", "A"]]}, {"label": "2. Unit 4 Reading", "questions": [["ตามบทความ นักศึกษาต่างชาติกลุ่มใดมีจำนวนมากที่สุดในสหรัฐฯ ปี 2019?", "จีน", "อินเดีย", "เกาหลีใต้", "เวียดนาม", "A"], ["ครอบครัวแบบใดที่สามารถ homeschool ลูกได้ง่ายกว่าช่วง COVID-19?", "White-collar", "Blue-collar", "ครอบครัวเดี่ยว", "ครอบครัวขยาย", "A"], ["เหตุใดโรงเรียนจึงสำคัญนอกเหนือจากการเรียนวิชาการ?", "ช่วยพัฒนาการด้านพฤติกรรมและสังคม", "ทำให้เด็กมีเงินมากขึ้น", "ทำให้เด็กโตเร็วขึ้น", "ไม่มีผลอื่นใด", "A"], ["ตามบทความ ปัจจัยใดทำให้ remote learning ไม่ได้ผลกับเด็กบางกลุ่ม?", "ขาดคอมพิวเตอร์/อินเทอร์เน็ต", "ครูไม่เก่งพอ", "โรงเรียนปิดถาวร", "ไม่มีการบ้าน", "A"]]}, {"label": "3. Article & Quantifier", "questions": [["เลือกคำที่ถูกต้อง: I bought ___ umbrella.", "a", "an", "the", "Ø", "B"], ["เลือกคำที่ถูกต้อง: She has ___ books on the shelf.", "much", "many", "little", "a little", "B"], ["คำใดใช้กับคำนามนับไม่ได้เท่านั้น?", "many", "a few", "much", "several", "C"], ["'a university' ใช้ 'a' เพราะเหตุใด?", "ออกเสียงขึ้นต้นด้วยเสียงพยัญชนะ /j/", "ขึ้นต้นด้วยสระ", "เป็นคำนามเฉพาะ", "เป็นคำนามพหูพจน์", "A"], ["คำใดใช้ได้ทั้งกับคำนามนับได้และนับไม่ได้?", "few", "much", "some", "little", "C"]]}, {"label": "4. Unit 3 Vocabulary", "questions": [["'diagnose' หมายความว่าอย่างไร?", "วินิจฉัยโรค", "รักษาโรค", "ป้องกันโรค", "แพร่เชื้อโรค", "A"], ["'crude estimate' หมายถึงอะไร?", "การประมาณแบบหยาบๆ ไม่ละเอียด", "การประมาณที่แม่นยำมาก", "การไม่ประมาณเลย", "การคำนวณด้วยเครื่องคอมพิวเตอร์", "A"], ["'stimulus' (พหูพจน์ stimuli) หมายถึงอะไร?", "สิ่งกระตุ้น", "อาการปวด", "ยารักษาโรค", "ผลข้างเคียง", "A"], ["'tumor' หมายถึงอะไร?", "เนื้องอกหรือก้อนเนื้อ", "อาการปวดหัว", "ยาชนิดหนึ่ง", "การผ่าตัด", "A"], ["'productivity' หมายถึงอะไร?", "ประสิทธิภาพในการทำงาน/ผลผลิต", "ราคาสินค้า", "จำนวนพนักงาน", "รายชื่อลูกค้า", "A"]]}, {"label": "5. Unit 3 Reading", "questions": [["สูตรของ BMI คืออะไร?", "น้ำหนัก(กก.) หาร ส่วนสูง²(เมตร)", "ส่วนสูง หาร น้ำหนัก", "น้ำหนัก คูณ ส่วนสูง", "อายุ หาร น้ำหนัก", "A"], ["ค่า BMI เท่าใดที่ถือว่าเป็นโรคอ้วน?", "≥ 30", "10-15", "15-20", "20-25", "A"], ["เหตุใด BMI จึงไม่แม่นยำกับนักกีฬา?", "กล้ามเนื้อหนักกว่าไขมันทำให้ BMI สูงเกินจริง", "นักกีฬามีน้ำหนักน้อยเกินไป", "นักกีฬาสูงเกินไป", "BMI ไม่เกี่ยวกับนักกีฬา", "A"], ["ใครคือผู้ค้นพบการใช้เปลือกต้นหลิวรักษาอาการปวดหัว?", "Hippocrates", "Isaac Newton", "Louis Pasteur", "Charles Darwin", "A"], ["อาการปวดหัวชนิดใดพบมากในผู้ชายและเกิดเวลาเดิมซ้ำๆ?", "Cluster headache", "Tension headache", "Migraine", "Secondary headache", "A"]]}, {"label": "รวมทุกบท · จำลองสอบ", "questions": [["'aspirin' พัฒนามาจากสารใด?", "Salicin จากเปลือกต้นหลิว", "น้ำมันมะพร้าว", "สารเคมีสังเคราะห์ล้วน", "คาเฟอีน", "A"], ["ข้อใดคือความหมายของ 'independent' ในบริบทนักศึกษาต่างชาติ?", "พึ่งพาตนเองได้มากขึ้น", "ขาดความมั่นใจ", "ต้องพึ่งพาครอบครัวมากขึ้น", "ไม่มีเพื่อน", "A"], ["Quantifier ใดถูกต้องสำหรับ 'She doesn't have ___ money.'", "much", "many", "a few", "several", "A"], ["'closure' ในบริบท COVID-19 หมายถึงอะไร?", "การปิด (โรงเรียน)", "การเปิดเรียน", "การสอบ", "การประชุม", "A"], ["Migraine มักถูกกระตุ้น (triggered) โดยสิ่งใด?", "การนอนไม่พอหรืออาหาร/กลิ่นบางชนิด", "การออกกำลังกาย", "การอ่านหนังสือ", "การพักผ่อนเพียงพอ", "A"]]}];

const menu=document.getElementById("menuList");
function buildMenu(list=topics){
 menu.innerHTML="";
 let lastPart="";
 list.forEach((t)=>{
   const original=topics.indexOf(t);
   const title=t.title.trim();

   // ใช้โครงสร้างหมวดบทแบบเดียวกับวิชาอื่น แต่คงชื่อ Part ของ English ไว้
   let part=title.includes("·") ? title.split("·")[0].trim() : "";
   if(title.toUpperCase().startsWith("MINI QUIZ")) part="Quiz";

   if(part!==lastPart){
     const label=document.createElement("div");
     label.className="menu-section";
     label.textContent=part || "เนื้อหาทั้งหมด";
     menu.appendChild(label);
     lastPart=part;
   }

   const b=document.createElement("button");
   b.className="topic-btn";
   b.dataset.topicIndex=original;

   const cleanTitle=title.includes("·")
     ? title.split("·").slice(1).join("·").trim()
     : title;
   const cleanSub=(t.sub||"").replace(/^[^·]+·\s*/,"").trim();

   b.innerHTML=`<span class="topic-num">${String(original+1).padStart(2,"0")}</span>
   <span class="topic-copy">
     <span class="topic-label">${cleanTitle}</span>
     <span class="topic-sub">${cleanSub}</span>
   </span>
   <span class="topic-arrow">›</span>`;

   b.onclick=()=>{showTopic(original);closeMenu()};
   menu.appendChild(b);
 });
}
buildMenu();

function filterMenu(){
 const q=document.getElementById("search").value.toLowerCase();
 buildMenu(topics.filter(t=>(t.title+" "+t.sub+" "+t.intro).toLowerCase().includes(q)));
}

function showTopic(i){
 const t=topics[i];
 let body="";
 if(t.sections){
  t.sections.forEach(s=>{
   body+=`<section class="sec-card"><h3>${s[0]}</h3><ul>${s[1].map(x=>`<li>${x}</li>`).join("")}</ul></section>`;
  });
 }
 let quiz="";
 if(i===10){
  quiz=`<div class="quiz"><h3>📝 Quiz</h3>
   <div class="quiz-bar" id="quizBar"><button type="button" class="qb-reset" onclick="resetQuiz()">↺ ทำใหม่</button><div class="qb-score" id="qbScore"><small>คะแนน</small><b>– / –</b></div></div><button type="button" id="quizPickBtn" class="quiz-pick-btn" onclick="openQuizPicker(event)">
      <span class="qp-ico" id="qpIco">🎯</span>
      <span class="qp-txt"><span class="qp-lab">📚 เลือกบทฝึก</span><span class="qp-cur" id="qpCur">—</span><span class="qp-sub" id="qpSub"></span></span>
      <span class="qp-go">เลือกบท ▾</span>
    </button><div id="quizArea"></div>
   <p class="small">หมายเหตุ: คำถามอ้างอิงจากเนื้อหาที่สรุปไว้ในแต่ละบท</p></div>`;
 }
 document.getElementById("page").innerHTML=`
   <div class="topic-head">
     <div class="topic-no">${i+1}</div>
     <div><h2>${t.title}</h2>
   ${t.sub?`<div class="subtitle">${t.sub}</div>`:""}</div>
   </div>
   ${t.intro?`<p class="intro">${t.intro}</p>`:""}
   ${body}
   ${t.formula?`<div class="formula">${t.formula}</div>`:""}
   ${t.note?`<div class="note"><b>⭐ จุดที่ควรจำ</b><br>${t.note}</div>`:""}
   ${quiz}
   <div class="nav">
    <button onclick="showTopic(${i-1})" ${i===0?"disabled":""}>← บทก่อนหน้า</button>
    <button onclick="showTopic(${i+1})" ${i===topics.length-1?"disabled":""}>บทถัดไป →</button>
   </div>`;
 if(i===10) renderQuiz(5);
 document.querySelectorAll(".topic-btn").forEach(b=>{
   b.classList.toggle("active",Number(b.dataset.topicIndex)===i);
   b.setAttribute("aria-current",Number(b.dataset.topicIndex)===i ? "page" : "false");
 });
 document.getElementById("progress").style.width=((i+1)/topics.length*100)+"%"; document.getElementById("progressText").textContent="บท "+(i+1)+" / "+topics.length;
 window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuiz(bankIndex){
 const bank=quizBanks[bankIndex];
 if(!bank) return;
 qzCurrent=bankIndex;
 qzSubmitted=false;
 const curEl=document.getElementById("qpCur");
 if(curEl) curEl.textContent=String(bank.label).replace(/^\d+\.\s*/,"");
 const subEl=document.getElementById("qpSub");
 if(subEl) subEl.textContent=bank.questions.length+" ข้อ · "+(bankIndex===quizBanks.length-1?"ทบทวนรวม":"ฝึกเฉพาะบท");
 const icoEl=document.getElementById("qpIco");
 if(icoEl) icoEl.textContent=qzIcon(bankIndex);
 const area=document.getElementById("quizArea");
 if(!area) return;
 const L=["A","B","C","D"];
 area.innerHTML=bank.questions.map((q,n)=>`
  <div class="q" data-i="${n}" data-correct="${q[5]}">
   <b>${n+1}) ${q[0]}</b>
   ${L.map((l,k)=>`<button type="button" class="opt" data-l="${l}" onclick="pickAnswer(this)">${l}. ${q[k+1]}</button>`).join("")}
   <div class="answer"></div>
  </div>`).join("")+`
  <div class="quiz-submit-wrap">
   <div class="quiz-note" id="quizNote"></div>
   <button type="button" class="qb-submit" id="qbSubmit" onclick="submitQuiz()">ส่งคำตอบ</button>
  </div>`;
 qzUpdateBar();
}
function pickAnswer(btn){
 if(qzSubmitted) return;
 const box=btn.closest(".q");
 box.classList.remove("unanswered");
 box.querySelectorAll(".opt").forEach(b=>b.classList.remove("picked"));
 btn.classList.add("picked");
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzUpdateBar();
}
function qzUpdateBar(){
 const area=document.getElementById("quizArea"); if(!area) return;
 const total=area.querySelectorAll(".q").length;
 const answered=area.querySelectorAll(".opt.picked").length;
 const sub=document.getElementById("qbSubmit");
 const sc=document.getElementById("qbScore");
 if(qzSubmitted) return;
 if(sub) sub.disabled=false;
 if(sc){
  sc.className="qb-score";
  sc.innerHTML='<small>ตอบแล้ว</small><b>'+answered+' / '+total+'</b>';
 }
}
function submitQuiz(){
 if(qzSubmitted) return;
 const area=document.getElementById("quizArea"); if(!area) return;
 const qs=[...area.querySelectorAll(".q")];
 const missing=qs.filter(q=>!q.querySelector(".opt.picked"));
 if(missing.length){
  qs.forEach(q=>q.classList.toggle("unanswered",!q.querySelector(".opt.picked")));
  const note=document.getElementById("quizNote");
  if(note){ note.textContent="ยังไม่ได้ตอบอีก "+missing.length+" ข้อ (ข้อ "+missing.map(q=>+q.dataset.i+1).join(", ")+") — ตอบให้ครบก่อนส่งนะ"; note.classList.add("show"); }
  missing[0].scrollIntoView({behavior:"smooth",block:"center"});
  return;
 }
 qzSubmitted=true;
 let score=0;
 qs.forEach(q=>{
  const correct=q.dataset.correct;
  const picked=q.querySelector(".opt.picked");
  const letter=picked.dataset.l;
  const ok=letter===correct;
  if(ok) score++;
  q.classList.add(ok?"is-right":"is-wrong");
  q.querySelectorAll(".opt").forEach(b=>{
   b.disabled=true;
   b.classList.remove("picked");
   if(b.dataset.l===correct) b.classList.add("right");
   else if(b===picked) b.classList.add("wrong");
  });
  const ans=q.querySelector(".answer");
  ans.style.display="block";
  ans.textContent=ok?"✅ ถูกต้อง!":"❌ ยังไม่ถูก — เฉลยคือ "+correct;
  ans.style.color=ok?"#15803d":"#dc2626";
 });
 const total=qs.length;
 const sc=document.getElementById("qbScore");
 if(sc){
  sc.className="qb-score "+(score/total>=0.5?"done":"low");
  sc.innerHTML='<small>คะแนน</small><b>'+score+' / '+total+'</b>';
 }
 const sub=document.getElementById("qbSubmit"); if(sub) sub.disabled=true;
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function qzScrollTo(id){
 const el=document.getElementById(id); if(!el) return;
 const y=el.getBoundingClientRect().top+window.pageYOffset-84;
 window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
}
function resetQuiz(){
 if(qzCurrent===null) return;
 renderQuiz(qzCurrent);
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function openMenu(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}

/* ===== Quiz chapter popup (shared) ===== */
let qzCurrent=null;
let qzSubmitted=false;
let qzByKey=false;
function qzIcon(n){
  const last=quizBanks.length-1;
  if(n===last) return "🎯";
  const pool=(typeof quizIcons!=="undefined"&&quizIcons)||["📘","📗","📙","📕","📒","📓","📔"];
  return pool[n%pool.length];
}
function qzEnsureModal(){
  let m=document.getElementById("qzModal");
  if(m) return m;
  m=document.createElement("div");
  m.id="qzModal";
  m.setAttribute("role","dialog");
  m.setAttribute("aria-modal","true");
  m.setAttribute("aria-labelledby","qzTitle");
  m.innerHTML=`<div class="qz-back" onclick="closeQuizPicker()"></div>
   <div class="qz-box">
    <div class="qz-head">
      <div class="qz-head-ico">📝</div>
      <div><h4 id="qzTitle">📚 เลือกบทที่จะฝึก</h4><small>แตะบทที่ต้องการ แล้วโจทย์จะขึ้นให้ทันที</small></div>
      <button type="button" class="qz-x" aria-label="ปิด" onclick="closeQuizPicker()">×</button>
    </div>
    <div class="qz-list" id="qzList"></div>
   </div>`;
  document.body.appendChild(m);
  return m;
}
function openQuizPicker(ev){
  qzByKey=!!(ev&&ev.detail===0);
  const m=qzEnsureModal();
  const last=quizBanks.length-1;
  document.getElementById("qzList").innerHTML=quizBanks.map((b,n)=>{
    const isAll=n===last;
    const name=String(b.label).replace(/^\d+\.\s*/,"");
    return `<button type="button" class="qz-item${isAll?" all":""}${n===qzCurrent?" active":""}" onclick="pickQuiz(${n})">
      <span class="qz-i">${qzIcon(n)}</span>
      <span class="qz-t"><span class="qz-n">${name}</span><span class="qz-c">${b.questions.length} ข้อ · ${isAll?"ทบทวนรวม":"ฝึกเฉพาะบท"}</span></span>
      <span class="qz-ok">✓</span>
    </button>`;
  }).join("");
  m.classList.add("show");
  document.body.classList.add("qz-lock"); document.documentElement.classList.add("qz-lock");
  const act=m.querySelector(".qz-item.active")||m.querySelector(".qz-item");
  if(act){ act.focus({preventScroll:true}); act.scrollIntoView({block:"nearest"}); }
}
function closeQuizPicker(){
  const m=document.getElementById("qzModal");
  if(m) m.classList.remove("show");
  document.body.classList.remove("qz-lock"); document.documentElement.classList.remove("qz-lock");
  const b=document.getElementById("quizPickBtn"); if(b&&qzByKey) b.focus({preventScroll:true});
  qzByKey=false;
}
function pickQuiz(n){
  renderQuiz(n);
  closeQuizPicker();
  const a=document.getElementById("quizArea");
  if(a) setTimeout(()=>a.scrollIntoView({behavior:"smooth",block:"start"}),60);
}



/* keep wheel / touch scrolling working inside the popup, never on the page behind */
document.addEventListener("wheel",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList");
  if(list && list.contains(e.target)) return;      // native scroll inside the list
  e.preventDefault();
  if(list) list.scrollTop += e.deltaY;              // wheel on backdrop/header -> scroll the list
},{passive:false});
document.addEventListener("keydown",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList"); if(!list) return;
  const step={ArrowDown:60,ArrowUp:-60,PageDown:list.clientHeight*0.9,PageUp:-list.clientHeight*0.9}[e.key];
  if(step!==undefined){ e.preventDefault(); list.scrollTop+=step; }
  else if(e.key==="Home"){ e.preventDefault(); list.scrollTop=0; }
  else if(e.key==="End"){ e.preventDefault(); list.scrollTop=list.scrollHeight; }
});

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=document.getElementById("qzModal"); if(m&&m.classList.contains("show")) closeQuizPicker(); }});

showTopic(0);
</script>
