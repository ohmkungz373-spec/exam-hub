const topics=[{"title": "ข้อ 1 · ประวัติและผลงานของนิวตัน", "sub": "เซอร์ไอแซก นิวตัน · 1642–1727", "intro": "เซอร์ไอแซก นิวตัน (Sir Isaac Newton) เป็นนักวิทยาศาสตร์และนักคณิตศาสตร์ชาวอังกฤษ ผู้วางรากฐานของวิชาฟิสิกส์", "sections": [["ผลงานสำคัญ", ["<b>กฎการเคลื่อนที่ 3 ข้อ</b> อธิบายแรงและการเคลื่อนที่ของวัตถุ เป็นรากฐานของวิชาฟิสิกส์", "<b>กฎแรงโน้มถ่วงสากล</b> แรงดึงดูดระหว่างมวลของวัตถุต่างๆ ในเอกภพ", "<b>ด้านแสงและสี</b> ค้นพบว่าแสงสีขาวประกอบด้วยแสงสีรุ้ง และประดิษฐ์กล้องโทรทรรศน์แบบสะท้อนแสง", "<b>ด้านคณิตศาสตร์</b> พัฒนาวิชาแคลคูลัสขึ้นมาเพื่อใช้คำนวณทางฟิสิกส์"]], ["วลีดังของนิวตัน", ["\"If I have seen further, it is by standing on the shoulders of giants\"", "แปลว่า \"หากฉันมองเห็นได้ไกลกว่าผู้อื่น ก็เพราะฉันยืนอยู่บนบ่าของยักษ์\"", "<strong>ความหมาย</strong>: ความสำเร็จในวันนี้เกิดจากการต่อยอดความรู้ของนักปราชญ์รุ่นก่อน"]]], "note": "นิวตันเป็นผู้ค้นพบ <b>กฎการเคลื่อนที่ 3 ข้อ</b> และ <b>กฎแรงโน้มถ่วงสากล</b> หน่วยของแรงในระบบ SI จึงตั้งชื่อว่า นิวตัน (N)"}, {"title": "ข้อ 2 · มวลและความเฉื่อย", "sub": "Mass & Inertia", "intro": "มวลคือปริมาณของสสารที่ประกอบกันเป็นวัตถุ พูดง่ายๆ คือ <mark>\"เนื้อของวัตถุ\"</mark> และมวลเป็นตัวบ่งบอกความเฉื่อยของวัตถุ", "sections": [["มวล (Mass)", ["เป็นปริมาณสเกลาร์ มีแต่ขนาด <b>ไม่มีทิศทาง</b>", "หน่วยในระบบ SI คือ <b>กิโลกรัม (kg)</b>", "<b>ไม่ขึ้นอยู่กับสถานที่</b> ไม่ว่าจะอยู่บนโลก ดวงจันทร์ หรืออวกาศที่ไร้แรงโน้มถ่วง มวลยังคงเท่าเดิมเสมอ"]], ["ความเฉื่อย (Inertia)", ["คือ <b>สมบัติในการต้านการเปลี่ยนสภาพการเคลื่อนที่ของวัตถุ</b>", "มวลมาก → ต้านการเปลี่ยนสภาพมาก → <b>ขยับยาก หรือ หยุดยาก</b>", "มวลน้อย → ต้านการเปลี่ยนสภาพน้อย → <b>ขยับง่าย หรือ หยุดง่าย</b>", "{{img:s_inertia|ช้าง (มวลมาก) มีความเฉื่อยมากกว่าคนตัวเล็ก (มวลน้อย)}}"]]], "note": "มวล (kg) เป็น <b>สเกลาร์</b> และคงที่ทุกสถานที่ ส่วนความเฉื่อยวัดได้จากมวล: มวลมาก = เฉื่อยมาก"}, {"title": "ข้อ 3 · แรงและการหาแรงลัพธ์", "sub": "Force & Net Force", "intro": "แรงคือการกระทำใดๆ ที่ทำให้วัตถุเปลี่ยนสภาพการเคลื่อนที่ (motion) หรือเปลี่ยนรูปร่าง (deformation)", "sections": [["สมบัติของแรง", ["แรงเป็นปริมาณ <b>เวกเตอร์</b> (Vector Quantity)", "<b>ขนาด (Magnitude)</b> บอกว่าแรงนั้นมีค่ามากน้อยเพียงใด", "<b>ทิศทาง (Direction)</b> บอกว่าแรงนั้นกระทำไปในทิศทางใด", "หน่วยของแรงคือ <b>นิวตัน (Newton, N)</b>"]], ["แรงทำให้เกิดอะไรได้บ้าง", ["ทำให้วัตถุ <b>เร็วขึ้น</b> (speed up) หรือ <b>ช้าลง</b> (slow down)", "ทำให้วัตถุ <b>เปลี่ยนทิศทาง</b> (change direction)", "ทำให้วัตถุ <b>เปลี่ยนรูปร่าง</b> (change shape)", "{{img:s_force_types|ผลของแรงต่อวัตถุ 4 แบบ}}"]], ["แรงลัพธ์ (Net Force, ΣF)", ["<strong>แรงลัพธ์</strong> = ผลรวมเวกเตอร์ของแรงทุกแรงที่กระทำต่อวัตถุ", "แรงที่ทิศเดียวกัน → <b>บวกกัน</b> ; แรงที่ทิศตรงข้ามกัน → <b>ลบกัน</b>", "<strong>ถ้าแรงตั้งฉากกัน ใช้ทฤษฎีพีทาโกรัส</strong>: R = √(Fx² + Fy²)", "{{img:s_net_force|ตัวอย่างการหาแรงลัพธ์: ผลัก-ดึง และแรงดึงเชือกชักเย่อ}}"]], ["การแตกแรง", ["แรง F ทำมุม θ กับแกน x : <b>Fx = F cosθ</b> และ <b>Fy = F sinθ</b>", "<strong>ค่าที่ควรจำ: sin30°</strong> = 1/2 , cos30° = √3/2 , sin45° = cos45° = √2/2 , sin60° = √3/2 , cos60° = 1/2", "<strong>มุม 37° และ 53°: sin37°</strong> = 0.6 , cos37° = 0.8"]]], "formula": "Fx = F cosθ     Fy = F sinθ\nR = √(Fx² + Fy²)", "note": "แรงเป็นเวกเตอร์ต้องบอกทั้ง <b>ขนาดและทิศทาง</b> หน่วย N ; แรงลัพธ์ = ผลรวมเวกเตอร์ของทุกแรง"}, {"title": "ข้อ 4 · กฎข้อที่ 1 (กฎแห่งความเฉื่อย)", "sub": "Newton's First Law · The Law of Inertia", "intro": "วัตถุจะรักษาสภาพหยุดนิ่ง หรือสภาพเคลื่อนที่ด้วยความเร็วคงที่ในแนวเส้นตรง ตราบใดที่ไม่มีแรงลัพธ์ที่ไม่เป็นศูนย์มากระทำต่อวัตถุ", "sections": [["ใจความสำคัญ", ["<b>ΣF = 0</b> ↔ วัตถุอยู่นิ่ง หรือเคลื่อนที่ด้วยความเร็วคงที่ (a = 0)", "<strong>ถ้าของอยู่นิ่งๆ ก็จะอยู่นิ่งๆ ต่อไป</strong>", "ถ้าของกำลังเคลื่อนที่ ก็จะเคลื่อนที่เป็นเส้นตรงด้วยความเร็วเท่าเดิมไปเรื่อยๆ", "การที่วัตถุพยายามรักษาสภาพการเคลื่อนที่เดิมไว้ เรียกว่า <b>ความเฉื่อย</b>"]], ["ตัวอย่างในชีวิตจริง", ["รถยนต์เบรกกะทันหัน คนที่นั่งจะ <b>พุ่งไปข้างหน้า</b> เพราะร่างกายพยายามรักษาสภาพการเคลื่อนที่เดิมไว้", "นี่คือเหตุผลที่ต้อง <b>คาดเข็มขัดนิรภัย</b>"]]], "formula": "ΣF = 0   →   a = 0", "note": "กฎข้อ 1 = <b>กฎความเฉื่อย</b> : ΣF = 0 วัตถุจึงหยุดนิ่งหรือเคลื่อนที่ด้วยความเร็วคงที่ (ไม่ได้แปลว่าไม่มีแรงเลย แต่แรงลัพธ์เป็นศูนย์)"}, {"title": "ข้อ 5 · กฎข้อที่ 2 (กฎของความเร่ง)", "sub": "Newton's Second Law · ΣF = ma", "intro": "เมื่อมีแรงลัพธ์ที่ไม่เป็นศูนย์มากระทำต่อวัตถุ วัตถุจะเคลื่อนที่ด้วยความเร่งในทิศทางเดียวกับแรงลัพธ์นั้น", "sections": [["ความหมาย", ["ถ้าเราออกแรงผลักวัตถุ วัตถุจะเคลื่อนที่เร็วขึ้น (เกิดความเร่ง)", "ยิ่งออกแรงมาก วัตถุก็ยิ่งเคลื่อนที่เร็วขึ้นมาก (ความเร่งมาก)", "ถ้าวัตถุมีมวลมาก (หนัก) จะต้องออกแรงมากขึ้นเพื่อให้ได้ความเร่งเท่ากับวัตถุที่มีมวลน้อย (เบา)", "{{img:s_f_ma_push|มวล 400 kg ต้องออกแรงมากกว่ามวล 40 kg เพื่อให้ได้ความเร่งเท่ากัน}}"]], ["ความสัมพันธ์ของตัวแปร", ["ความเร่ง (a) <b>แปรผันตรง</b>กับ แรงลัพธ์ (F) → แรงมาก ความเร่งมาก", "ความเร่ง (a) <b>แปรผกผัน</b>กับ มวล (m) → มวลมาก ความเร่งน้อย", "{{img:s_f_ma_cart|แรงเท่ากัน (F) แต่มวลต่างกัน ได้ความเร่งต่างกัน: m → a , ½m → 2a , 2m → ½a}}"]], ["ตัวแปรในสมการ", ["ΣF = แรงลัพธ์ (หน่วย <b>N</b>)", "m = มวลของวัตถุ (หน่วย <b>kg</b>)", "a = ความเร่ง (หน่วย <b>m/s²</b>)"]]], "formula": "ΣF = ma\na = ΣF / m", "note": "<strong>1 นิวตัน</strong> = แรงที่ทำให้มวล 1 kg เกิดความเร่ง 1 m/s² ; ทิศของ a เป็นทิศเดียวกับ ΣF เสมอ"}, {"title": "ข้อ 6 · กฎข้อที่ 3 (แรงกิริยา–ปฏิกิริยา)", "sub": "Newton's Third Law · Action–Reaction", "intro": "ทุกแรงกิริยา (Action) ย่อมมีแรงปฏิกิริยา (Reaction) ที่มีขนาดเท่ากัน แต่มีทิศทางตรงกันข้ามเสมอ", "sections": [["คุณสมบัติของคู่แรง Action–Reaction (จุดเน้นในข้อสอบ)", ["<b>1. มีขนาดเท่ากัน</b>", "<b>2. มีทิศทางตรงข้ามกัน</b>", "<b>3. เกิดขึ้นพร้อมกันเสมอ</b>", "<b>4. กระทำต่อวัตถุคนละก้อน</b> จึง <b>นำมาหักล้างกันไม่ได้!</b>"]], ["ตัวอย่าง", ["เมื่อเราออกแรงกระทำต่อสิ่งใด (แรงกิริยา) สิ่งนั้นจะออกแรงกระทำต่อเรากลับมาทันที (แรงปฏิกิริยา)", "<strong>จรวด/เครื่องบินไอพ่น</strong>: พ่นแก๊สลงข้างล่าง แก๊สดันจรวดขึ้นข้างบน", "นักบินอวกาศผลักกันในอวกาศ ต่างคนต่างลอยไปคนละทิศ", "ปืนยิงกระสุนออกไป ปืนถูกแรงปฏิกิริยาดันถอยหลัง (แรงสะท้อน)", "\"ทางเดียวที่มนุษย์จะไปข้างหน้า ต้องทิ้งบางสิ่งไว้ข้างหลัง\""]]], "formula": "F(action) = − F(reaction)", "note": "แรงกิริยา-ปฏิกิริยา <b>ขนาดเท่ากัน ทิศตรงข้าม แต่กระทำต่อวัตถุคนละก้อน</b> จึงไม่หักล้างกัน (ต่างจากแรงสมดุลที่กระทำต่อวัตถุก้อนเดียวกัน)"}, {"title": "ข้อ 7 · น้ำหนัก (Weight)", "sub": "W = mg", "intro": "น้ำหนักเป็น <mark>\"แรง\"</mark> ชนิดหนึ่ง ไม่ใช่ปริมาณเดียวกับมวล คือแรงดึงดูดของโลก (หรือดาวเคราะห์) ที่กระทำต่อมวลของวัตถุ", "sections": [["สมบัติของน้ำหนัก", ["เป็นปริมาณ <b>เวกเตอร์</b> มีทิศทางชี้เข้าหาศูนย์กลางของโลก (ทิศพุ่งลงในแนวดิ่งเสมอ)", "หน่วยเป็น <b>นิวตัน (N)</b> ต่างจากมวลที่มีหน่วยเป็น kg", "<strong>W</strong> = น้ำหนัก (N) , m = มวล (kg) , g = ความเร่งเนื่องจากแรงโน้มถ่วง (m/s² หรือ N/kg)", "<strong>ในการคำนวณมักใช้ g</strong> = 9.8 m/s² หรือ 10 m/s²"]], ["ปัจจัยที่ทำให้น้ำหนักเปลี่ยนแปลง", ["<b>ระยะห่างจากศูนย์กลางดาว</b> ยิ่งอยู่สูงจากผิวโลก ค่า g ยิ่งลดลง ทำให้น้ำหนักลดลง (แต่มวลยังเท่าเดิม)", "<b>ตำแหน่งบนดาวเคราะห์ต่างดวง</b> เช่น ค่า g บนดวงจันทร์มีค่าเพียงประมาณ 1/6 ของโลก", "<strong>ตัวอย่าง</strong>: วัตถุมวล 60 kg มีน้ำหนักบนโลก 600 N แต่บนดวงจันทร์เพียง 100 N", "{{img:s_weight_planet|มวล 50 kg เท่าเดิม แต่น้ำหนักต่างกันตามค่า g ของแต่ละดาว}}", "{{img:s_weight_scale|มวลคงที่ (mass is constant) แต่น้ำหนักเปลี่ยนไปตามที่อยู่ (weight is variable)}}"]]], "formula": "W = mg", "note": "<b>มวลคงที่ทุกสถานที่ แต่น้ำหนักเปลี่ยนตามค่า g</b> ; ในอวกาศที่ไร้แรงโน้มถ่วง น้ำหนักเป็นศูนย์ แต่มวลยังคงเดิม"}, {"title": "ข้อ 8 · โจทย์ฝึกจากใบงาน (พร้อมเฉลยวิธีทำ)", "sub": "ใบงาน \"วิธีแก้กรรม\" · 23 ข้อ · 9 หมวด", "intro": "รวบรวมโจทย์จากใบงานครบทุกข้อ พร้อมรูปประกอบและเฉลยวิธีทำอย่างละเอียด ลองคิดเองก่อน แล้วค่อยกด <mark>\"ดูเฉลย\"</mark> (ใช้ g = 10 m/s² ตามที่ใบงานกำหนด)", "note": "ขั้นตอนแก้โจทย์แรง: <b>① วาดแรงทุกแรง ② เลือกทิศบวก ③ เขียน ΣF = ma ④ แก้สมการ</b> ; ถ้า a = 0 ใช้ ΣF = 0"}, {"title": "Quiz", "sub": "", "intro": ""}];
const worksheet=[{"group": "1. หาแรงลัพธ์ (แตกแรง)", "items": [{"no": 1, "q": "จากรูป จงทำการแตกแรงที่กำหนดเพื่อหาขนาดของแรง x และ y ตามลำดับ", "img": "q01", "sol": ["<b>รูปบน</b> F = 8 N ทำมุม 45° กับแกน x : Fx = 8 cos45° = <b>4√2 ≈ 5.66 N</b> , Fy = 8 sin45° = <b>4√2 ≈ 5.66 N</b>", "<b>รูปล่าง</b> F = 10 N ทำมุม 60° กับแกน x : Fx = 10 cos60° = <b>5 N</b> , Fy = 10 sin60° = <b>5√3 ≈ 8.66 N</b>"]}, {"no": 2, "q": "จากรูป แรงลัพธ์ที่เกิดจากแรงย่อยทั้ง 3 แรงดังรูปจะมีขนาดเท่ากับข้อใดต่อไปนี้", "img": "q02", "sol": ["แตก 2√2 N ที่ 45° → x = 2√2 cos45° = 2 N (ไปทางขวา) , y = 2√2 sin45° = 2 N (ลง)", "แกน x (ขวาเป็นบวก): ΣFx = 2 − 8 = <b>−6 N</b> (ชี้ซ้าย)", "แกน y (ขึ้นเป็นบวก): ΣFy = 10 − 2 = <b>+8 N</b> (ชี้ขึ้น)", "R = √(6² + 8²) = √100 = <b>10 N</b>"]}]}, {"group": "2. การประยุกต์กฎนิวตัน แนวราบ", "items": [{"no": 3, "q": "จากรูปวัตถุมวล 10 กิโลกรัม และ 5 กิโลกรัม ผูกติดกันด้วยเชือก อยู่บนพื้นที่ไม่มีแรงเสียดทาน หากความเร่งของการเคลื่อนที่มีค่า 2 เมตร/วินาที² ให้หาแรง T₁ และ T₂", "img": "q03", "sol": ["<b>T₂</b> ดึงมวล 10 kg เพียงก้อนเดียว : T₂ = ma = 10 × 2 = <b>20 N</b>", "<b>T₁</b> ดึงมวลทั้งระบบ (10 + 5 = 15 kg) : T₁ = 15 × 2 = <b>30 N</b>", "ตรวจสอบ: มวล 5 kg : T₁ − T₂ = 5 × 2 → 30 − 20 = 10 ✓"]}, {"no": 4, "q": "จากรูปมวลขนาด 10, 8 และ 6 กิโลกรัม วางบนพื้นที่ไม่มีความฝืด ออกแรงขนาด 120 นิวตัน ลากมวลทั้งสามไป จงหาว่าขนาดของแรงดึงในเส้นเชือก T₁ และ T₂ มีค่ากี่นิวตัน", "img": "q04", "sol": ["ทั้งระบบ: a = F/M = 120 / (10+8+6) = 120/24 = <b>5 m/s²</b>", "<b>T₁</b> ดึงมวล 10 kg : T₁ = 10 × 5 = <b>50 N</b>", "<b>T₂</b> ดึงมวล 10 + 8 = 18 kg : T₂ = 18 × 5 = <b>90 N</b>", "ตรวจสอบ: มวล 6 kg : 120 − T₂ = 6 × 5 → 120 − 90 = 30 ✓"]}, {"no": 5, "q": "พื้นไม่มีความเสียดทาน ถ้าต้องการให้วัตถุทั้งสองเคลื่อนที่ด้วยความเร่ง 2 เมตรต่อวินาที² แรง P ต้องมีขนาดกี่นิวตัน (P ทำมุม 37° กับแนวระดับ)", "img": "q05", "sol": ["พิจารณาทั้งระบบ (4 + 8 = 12 kg) ในแนวราบ ใช้เฉพาะองค์ประกอบแนวราบของ P", "P cos37° = (4 + 8) × 2 = 24", "P × 0.8 = 24 → P = <b>30 N</b>"]}]}, {"group": "3. การประยุกต์กฎนิวตัน แนวดิ่ง", "items": [{"no": 6, "q": "เชือก A ทนแรงดึงได้ 24,000 นิวตัน และเชือก B ทนแรงดึงได้ 7,000 นิวตัน อยากทราบว่าค่าอัตราเร่ง (a) สูงสุดในการดึงมวลทั้งสองก้อน โดยเชือกไม่ขาดเป็นเท่าไร (g = 10)", "img": "q06", "sol": ["<b>เชือก B</b> ดึงมวล 500 kg : T_B − 500g = 500a → 7000 − 5000 = 500a → a = <b>4 m/s²</b>", "<b>เชือก A</b> ดึงมวลทั้งสอง 1500 kg : T_A − 1500g = 1500a → 24000 − 15000 = 1500a → a = <b>6 m/s²</b>", "เชือกไม่ขาด ต้องไม่เกินทั้งสองเงื่อนไข → ใช้ค่าที่น้อยกว่า : a สูงสุด = <b>4 m/s²</b>"]}, {"no": 7, "q": "เมื่อใช้แรงฉุด 200 นิวตัน ดึงวัตถุสามก้อนมวล 2, 3, 5 กิโลกรัม ขึ้นดังรูป จงหาความตึงเชือกแต่ละตอนระหว่างมวล และความเร่งของระบบนี้ ตอบตามลำดับ (g = 10)", "img": "q07", "sol": ["ทั้งระบบ (10 kg) : 200 − 10×10 = 10a → <b>a = 10 m/s²</b>", "<b>T₂</b> ดึงมวล 5 kg ขึ้น : T₂ − 5×10 = 5×10 → T₂ = <b>100 N</b>", "<b>T₁</b> ดึงมวล 3+5 = 8 kg ขึ้น : T₁ − 8×10 = 8×10 → T₁ = <b>160 N</b>", "ตอบ: T₁ = 160 N , T₂ = 100 N , a = 10 m/s²"]}, {"no": 8, "q": "จากรูป เป็นระบบของมวล 2 ก้อน (รอก) จงหาความเร่งและความตึงเชือก T (g = 10)", "img": "q08", "sol": ["ก้อน 10 kg ลงมา ก้อน 6 kg ขึ้นไป : (10 − 6)g = (10 + 6)a", "40 = 16a → <b>a = 2.5 m/s²</b>", "ก้อน 6 kg (ขึ้น) : T − 6g = 6a → T = 60 + 15 = <b>75 N</b>"]}]}, {"group": "4. ลิฟต์", "items": [{"no": 9, "q": "นายแดงยืนอยู่บนตาชั่งสปริงในลิฟต์ ถ้าลิฟต์อยู่นิ่งๆ นายแดงอ่านน้ำหนักตัวเองได้ 56 กิโลกรัม ถ้าลิฟต์เคลื่อนที่ นายแดงจะอ่านน้ำหนักตัวเองจากตาชั่งได้กี่กิโลกรัม (ก) ลิฟต์ขึ้นด้วยความเร่ง 2 m/s² (ข) ลิฟต์ลงด้วยความเร่ง 2 m/s² (ค) ลิฟต์ขึ้นด้วยความเร็วคงที่ 50 m/s", "img": null, "sol": ["ตาชั่งอ่านค่าแรงตั้งฉาก N ส่วนมวลจริง m = 56 kg (g = 10)", "<b>ก.</b> ขึ้นเร่ง : N − mg = ma → N = m(g + a) = 56 × 12 = 672 N → อ่านได้ <b>67.2 kg</b>", "<b>ข.</b> ลงเร่ง : mg − N = ma → N = m(g − a) = 56 × 8 = 448 N → อ่านได้ <b>44.8 kg</b>", "<b>ค.</b> ความเร็วคงที่ a = 0 : N = mg → อ่านได้ <b>56 kg</b>"]}, {"no": 10, "q": "นักเรียนคนหนึ่งมวล 50 กิโลกรัม ยืนอยู่บนตาชั่งในลิฟต์ที่กำลังเคลื่อนที่ขึ้นด้วยความเร่ง 1 เมตร/วินาที² ในขณะเดียวกันมือของเขาก็ดึงเชือกที่แขวนอยู่กับเพดานลิฟต์ ถ้าเชือกมีความตึง 150 นิวตัน เข็มของตาชั่งสปริงจะชี้ที่กี่กิโลกรัม (g = 10)", "img": null, "sol": ["เชือกดึงตัวนักเรียนขึ้น 150 N (ตามแรงตึงเชือก) ตาชั่งดันขึ้น N", "ขึ้นด้วยความเร่ง : N + T − mg = ma", "N + 150 − 500 = 50 × 1 → N = 400 N", "เข็มตาชั่งชี้ที่ <b>40 kg</b>"]}]}, {"group": "5. แรงเสียดทาน", "items": [{"no": 11, "q": "วางกล่องบนรถกระบะ สัมประสิทธิ์ความเสียดทานสถิตระหว่างกล่องกับพื้นกระบะเท่ากับ 0.5 ถ้าต้องการเร่งความเร็วของรถกระบะจากหยุดนิ่งเป็น 30 เมตรต่อวินาที โดยใช้เวลาให้น้อยที่สุดและกล่องไม่ไถลไปบนพื้นกระบะ จะต้องใช้เวลาเท่าใด (g = 10)", "img": null, "sol": ["กล่องเคลื่อนไปกับรถได้ เพราะแรงเสียดทานสถิตเป็นแรงที่ทำให้กล่องเร่ง", "ความเร่งมากที่สุดที่กล่องไม่ไถล : f_max = μₛN = μₛmg → a_max = μₛg = 0.5 × 10 = <b>5 m/s²</b>", "ใช้เวลาน้อยที่สุด เมื่อเร่งด้วย a_max : v = u + at → 30 = 0 + 5t", "t = <b>6 วินาที</b>"]}, {"no": 12, "q": "วัตถุ A และ B มีมวล 0.7 และ 0.3 กิโลกรัม ตามลำดับ วางติดกันบนพื้นราบ ถ้าออกแรงผลัก F เท่ากับ 100 นิวตัน ดังรูป จงหาว่าวัตถุทั้งสองจะเคลื่อนที่ไปด้วยความเร่งเท่าใด (กำหนดให้ μₛ = 0.6, μₖ = 0.4 , g = 10)", "img": "q12", "sol": ["แรงเสียดทานสถิตสูงสุด = μₛ(m_A+m_B)g = 0.6 × 1 × 10 = 6 N", "F = 100 N มากกว่า 6 N มาก → วัตถุ <b>เคลื่อนที่</b> ใช้แรงเสียดทานจลน์", "fₖ = μₖ(m_A+m_B)g = 0.4 × 1 × 10 = 4 N", "ΣF = ma : 100 − 4 = (0.7+0.3)a → <b>a = 96 m/s²</b>"]}, {"no": 13, "q": "จากรูปแรง F = 120 นิวตัน ดึงมวล 5 กิโลกรัม ดังรูป จงหาความเร่งของมวล 10 kg และแรงตึงเชือก T เมื่อสัมประสิทธิ์ของความเสียดทาน = 0.1 (g = 10)", "img": "q13", "sol": ["ทั้งระบบ (15 kg) แรงเสียดทานรวม = 0.1 × 15 × 10 = 15 N", "120 − 15 = 15a → <b>a = 7 m/s²</b> (เท่ากันทั้งสองก้อน)", "มวล 10 kg : T − f = ma → T − (0.1×10×10) = 10 × 7", "T − 10 = 70 → <b>T = 80 N</b>"]}]}, {"group": "6. พื้นเอียง", "items": [{"no": 14, "q": "กล่องไม้สี่เหลี่ยมมวล 4 kg ไถลลงมาตามพื้นลื่น เอียงทำมุม 30° กับแนวราบ ความเร่งของกล่องขณะลงมาตามพื้นเอียงจะเท่ากับเท่าไร (g = 10)", "img": "q14", "sol": ["พื้นลื่น ไม่มีแรงเสียดทาน แรงที่ทำให้กล่องเร่ง = ส่วนประกอบของน้ำหนักขนานพื้นเอียง", "mg sinθ = ma → a = g sinθ = 10 × sin30° = <b>5 m/s²</b>", "(ความเร่งไม่ขึ้นกับมวล)"]}, {"no": 15, "q": "วัตถุชิ้นหนึ่งมีมวล 2.0 กิโลกรัม ถูกดึงให้เคลื่อนที่ขึ้นไปตามพื้นเอียง 30 องศา โดยใช้เส้นเชือกตามรูป ถ้าความตึงในเส้นเชือกเป็น 40 นิวตัน และแรงเสียดทานมีขนาด 2.0 นิวตัน ความเร่งของวัตถุจะมีค่าเป็นเท่าไร (g = 10)", "img": "q15", "sol": ["แรงขนานพื้นเอียง: ขึ้น = T = 40 N ; ลง = mg sin30° + f = 2×10×0.5 + 2 = 12 N", "ΣF = ma : 40 − 12 = 2a", "<b>a = 14 m/s²</b>"]}, {"no": 16, "q": "มวล m วางบนพื้นเอียงซึ่งทำมุม 30° กับแนวระดับ ถ้าวัดได้ว่ามวลนั้นไถลลงพื้นเอียงด้วยความเร็วคงที่ สัมประสิทธิ์ความเสียดทานจลน์ระหว่างมวลนั้นกับพื้นจะเป็นเท่าไร", "img": "q16", "sol": ["ความเร็วคงที่ → a = 0 → แรงลัพธ์ = 0 : mg sinθ = fₖ = μₖ N = μₖ mg cosθ", "μₖ = tanθ = tan30° = <b>1/√3 ≈ 0.58</b>"]}]}, {"group": "7. แรงดึงดูดระหว่างมวล", "items": [{"no": 17, "q": "มวล m, 5m และ 9m อยู่กันเป็นระบบเรียงเป็นแถว (5m — m — 9m) ห่างกันตามลำดับ R และ R จงหาแรงโน้มถ่วงลัพธ์ที่กระทำแก่มวล m, 5m, 9m ตามลำดับ (ตอบในหน่วย Gm²/R²)", "img": null, "sol": ["ใช้ F = G m₁m₂ / r² (หน่วย Gm²/R²) ; ระยะระหว่าง 5m กับ 9m = 2R", "<b>มวล m</b> (อยู่กลาง): ถูกดึงจาก 5m = 5 (ไปซ้าย) , ถูกดึงจาก 9m = 9 (ไปขวา) → ลัพธ์ = 9 − 5 = <b>4 Gm²/R²</b> (ไปทาง 9m)", "<b>มวล 5m</b>: ถูก m ดึง = 5 ; ถูก 9m ดึง (ระยะ 2R) = 5×9/4 = 45/4 ; ทิศเดียวกัน → <b>65/4 Gm²/R²</b> (≈ 16.25)", "<b>มวล 9m</b>: ถูก m ดึง = 9 ; ถูก 5m ดึง (ระยะ 2R) = 9×5/4 = 45/4 ; ทิศเดียวกัน → <b>81/4 Gm²/R²</b> (≈ 20.25)", "ตอบ: m = 4 , 5m = 65/4 , 9m = 81/4 (Gm²/R²)"]}]}, {"group": "8. สมดุลต่อการเคลื่อนที่", "items": [{"no": 18, "q": "มวล 4 กิโลกรัม ผูกเชือกแขวนจากเพดาน นาย ก. ออกแรงผลักมวลไปในแนวระดับ จนเชือกทำมุม 30° กับแนวดิ่ง จงหาว่าเชือก T มีความตึงเท่าไร และต้องออกแรงผลักเท่าไรตามลำดับ (g = 10)", "img": "q18", "sol": ["สมดุล ΣF = 0 ; น้ำหนัก W = mg = 40 N", "แนวดิ่ง: T cos30° = 40 → T = 40/cos30° = <b>80/√3 ≈ 46.2 N</b>", "แนวราบ: P = T sin30° = 40 tan30° = <b>40/√3 ≈ 23.1 N</b>"]}, {"no": 19, "q": "แขวนวัตถุมวล m ด้วยเชือกเบาดังรูป ถ้าแรงดึงในเส้นเชือกตามแนวระดับมีขนาด 60 นิวตัน จงหามวล m (g = 10)", "img": "q19", "sol": ["เชือกเฉียงทำมุม 60° กับเพดาน (แนวระดับ) แรงตึง T", "แนวราบ: T cos60° = 60 → T = 120 N", "แนวดิ่ง: T sin60° = mg → 120 × (√3/2) = 10m → 60√3 = 10m", "<b>m = 6√3 ≈ 10.4 kg</b>"]}, {"no": 20, "q": "จากรูป นำเชือกผูกกับวัตถุ 4 กิโลกรัม จงหาขนาดของแรงดึงเชือก T₁ และ T₂ (g = 10)", "img": "q20", "sol": ["W = 40 N ; T₁ ทำมุม 60° และ T₂ ทำมุม 30° กับเพดาน (แนวระดับ)", "แนวราบ: T₁ cos60° = T₂ cos30° → T₁/2 = T₂√3/2 → T₁ = √3 T₂", "แนวดิ่ง: T₁ sin60° + T₂ sin30° = 40 → (√3T₂)(√3/2) + T₂/2 = 40 → 2T₂ = 40", "<b>T₂ = 20 N</b> , <b>T₁ = 20√3 ≈ 34.6 N</b>"]}]}, {"group": "9. สมดุลต่อการหมุน", "items": [{"no": 21, "q": "นาย A และนาย B ยืนอยู่ปลายกระดานหกคนละด้าน มวลของกระดาน 5 กิโลกรัม จุดหมุนอยู่ที่ C ถ้านาย A มีมวล 60 กิโลกรัม นาย B จะมีมวลกี่กิโลกรัม", "img": "q21", "sol": ["A ห่างจุดหมุน C = 4 m , B ห่างจุดหมุน C = 6 m → กระดานยาว 10 m", "น้ำหนักกระดานรวมที่กึ่งกลาง (ห่างจาก A 5 m) จึงอยู่ทางขวาของ C ห่าง 1 m (ด้าน B)", "สมดุลการหมุนรอบ C : Στ(ทวนเข็ม) = Στ(ตามเข็ม)", "m_A × 4 = m_B × 6 + m_กระดาน × 1 → 60×4 = 6 m_B + 5×1", "240 − 5 = 6 m_B → m_B = 235/6 ≈ <b>39.2 kg</b>"]}, {"no": 22, "q": "คานสม่ำเสมอยาว 50 เซนติเมตร มีไม้หมอนหนุนไว้ที่จุดกึ่งกลางคาน P และมีน้ำหนักแขวนไว้ที่ต่างๆ ดังรูป ถ้าต้องการให้คานวางตัวตามแนวระดับ จะต้องแขวนมวล 3 กิโลกรัม เพิ่มห่างจากจุด P กี่เซนติเมตร", "img": "q22", "sol": ["คานสม่ำเสมอ น้ำหนักคานอยู่ที่ P ไม่ทำให้เกิดโมเมนต์ ; ปลายซ้าย-ขวาห่างจาก P ข้างละ 25 cm", "ด้านซ้าย : 1 kg ที่ปลาย (25 cm) และ 3 kg ที่ระยะ x ; ด้านขวา : 4 kg ที่ปลาย (25 cm)", "สมดุลรอบ P : 1×25 + 3×x = 4×25", "25 + 3x = 100 → 3x = 75 → <b>x = 25 cm</b> (มวล 3 kg ต้องแขวนที่ปลายซ้ายเดียวกับมวล 1 kg)"]}, {"no": 23, "q": "คานสม่ำเสมอ ปลายหนึ่งยึดติดกับกำแพงด้วยตะปูเกลี้ยง อีกปลายหนึ่งยึดไว้ด้วยสายเคเบิล ดังแสดงในรูป ถ้าคานหนัก 100 นิวตัน และน้ำหนักที่ถ่วงขนาด 400 นิวตัน แรงดึงในสายเคเบิลจะเป็นกี่นิวตัน", "img": "q23", "sol": ["คานยาว 4 m ตามแนวราบ สายเคเบิลยึดที่ผนังสูงขึ้นไป 3 m → ความยาวสาย = √(3²+4²) = 5 m", "sinθ = 3/5 (θ คือมุมของสายกับแนวคาน) → องค์ประกอบแนวดิ่งของ T = T sinθ = 3T/5", "สมดุลการหมุนรอบจุด A (บานพับ): โมเมนต์ทวน = โมเมนต์ตามเข็ม", "(3T/5) × 4 = 100 × 2 + 400 × 4 = 200 + 1600 = 1800", "(12/5)T = 1800 → <b>T = 750 N</b>"]}]}];

const menu=document.getElementById("menuList");
function buildMenu(list=topics){
 menu.innerHTML="";
 let miniQuizSectionAdded=false;

 list.forEach((t)=>{
   const original=topics.indexOf(t);
   const title=t.title.trim();
   const isMiniQuiz=/^(mini\s*quiz|quiz)$/i.test(title);

   // เหลือหัวข้อหมวดไว้เฉพาะ Quiz เท่านั้น
   if(isMiniQuiz && !miniQuizSectionAdded){
     const label=document.createElement("div");
     label.className="menu-section";
     label.textContent="QUIZ";
     menu.appendChild(label);
     miniQuizSectionAdded=true;
   }

   const cleanSub=(t.sub||"").replace(/^[^·]+·\s*/,"").trim();

   const b=document.createElement("button");
   b.className="topic-btn";
   b.dataset.topicIndex=original;

   b.innerHTML=`<span class="topic-num">${String(original+1).padStart(2,"0")}</span>
   <span class="topic-copy">
     <span class="topic-label">${title.replace(/^ข้อ\s*\d+\s*·\s*/,"")}</span>
     <span class="topic-sub">${cleanSub}</span>
   </span>
   <span class="topic-arrow">›</span>`;

   b.onclick=()=>{showTopic(original);closeMenu()};
   menu.appendChild(b);
 });
}
buildMenu();

function filterMenu(){
 const q=document.getElementById("search").value.toLowerCase();
 buildMenu(topics.filter(t=>(t.title+" "+t.sub+" "+t.intro).toLowerCase().includes(q)));
}

function esc(s){return String(s)}
function figHTML(name,cap){
 const src=IMGS[name]; if(!src) return "";
 const w=IMGW[name]||600; const mw=w;
 return `<figure class="fig"><img style="max-width:min(100%,${mw}px)" src="${src}" alt="${(cap||"").replace(/"/g,"&quot;")}">${cap?`<figcaption>${cap}</figcaption>`:""}</figure>`;
}
function liHTML(x){
 const m=/^\{\{img:([^|}]+)\|?([^}]*)\}\}$/.exec(x);
 if(m) return `<li class="fig-li">${figHTML(m[1],m[2])}</li>`;
 return `<li>${x}</li>`;
}
function worksheetHTML(){
 let h=`<div class="ws-expand"><button type="button" onclick="wsAll(true)">▼ เปิดเฉลยทั้งหมด</button><button type="button" onclick="wsAll(false)">▲ ซ่อนเฉลยทั้งหมด</button></div>`;
 worksheet.forEach(g=>{
  h+=`<section class="ws-group"><h3>${g.group}</h3>`;
  g.items.forEach(it=>{
   h+=`<div class="ws-item" id="ws${it.no}"><div class="ws-q"><div class="ws-no">${it.no}</div><div class="ws-text">${it.q}</div></div>`+
      (it.img?figHTML(it.img,""):"")+
      `<button type="button" class="ws-toggle" aria-expanded="false" onclick="wsToggle(${it.no},this)">💡 ดูเฉลย</button>`+
      `<div class="ws-sol" id="sol${it.no}"><b class="ws-head">วิธีทำ</b><ol>${it.sol.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;
  });
  h+=`</section>`;
 });
 return h;
}
function wsToggle(no,btn){
 const el=document.getElementById("sol"+no); if(!el) return;
 const open=el.classList.toggle("open");
 btn.setAttribute("aria-expanded",open?"true":"false");
 btn.textContent=open?"🙈 ซ่อนเฉลย":"💡 ดูเฉลย";
}
function wsAll(open){
 document.querySelectorAll(".ws-sol").forEach(el=>el.classList.toggle("open",open));
 document.querySelectorAll(".ws-toggle").forEach(b=>{b.setAttribute("aria-expanded",open?"true":"false");b.textContent=open?"🙈 ซ่อนเฉลย":"💡 ดูเฉลย";});
}

 }
 document.getElementById("page").innerHTML=`

   </div>

   ${t.formula?`<div class="formula">${t.formula}</div>`:""}

   </div>`;
 if(i===QUIZ_INDEX) renderQuiz(quizBanks.length-1);

 });

 qzCurrent=bankIndex;
 qzSubmitted=false;
 const curEl=document.getElementById("qpCur");
 if(curEl) curEl.textContent=String(bank.label).replace(/^\d+\.\s*/,"");
 const subEl=document.getElementById("qpSub");
 if(subEl) subEl.textContent=bank.questions.length+" ข้อ · "+(bankIndex===quizBanks.length-1?"ทบทวนรวม":"ฝึกเฉพาะบท");
 const icoEl=document.getElementById("qpIco");
 if(icoEl) icoEl.textContent=qzIcon(bankIndex);
 const area=document.getElementById("quizArea");
 if(!area) return;
 const L=["A","B","C","D"];
 area.innerHTML=bank.questions.map((q,n)=>`
  <div class="q" data-i="${n}" data-correct="${q[5]}">
   <b>${n+1}) ${q[0]}</b>
   ${L.map((l,k)=>`<button type="button" class="opt" data-l="${l}" onclick="pickAnswer(this)">${l}. ${q[k+1]}</button>`).join("")}
   <div class="answer"></div>
  </div>`).join("")+`
  <div class="quiz-submit-wrap">
   <div class="quiz-note" id="quizNote"></div>
   <button type="button" class="qb-submit" id="qbSubmit" onclick="submitQuiz()">ส่งคำตอบ</button>
  </div>`;
 qzUpdateBar();
}
function pickAnswer(btn){
 if(qzSubmitted) return;
 const box=btn.closest(".q");
 box.classList.remove("unanswered");
 box.querySelectorAll(".opt").forEach(b=>b.classList.remove("picked"));
 btn.classList.add("picked");
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzUpdateBar();
}
function qzUpdateBar(){
 const area=document.getElementById("quizArea"); if(!area) return;
 const total=area.querySelectorAll(".q").length;
 const answered=area.querySelectorAll(".opt.picked").length;
 const sub=document.getElementById("qbSubmit");
 const sc=document.getElementById("qbScore");
 if(qzSubmitted) return;
 if(sub) sub.disabled=false;
 if(sc){
  sc.className="qb-score";
  sc.innerHTML='<small>ตอบแล้ว</small><b>'+answered+' / '+total+'</b>';
 }
}
function submitQuiz(){
 if(qzSubmitted) return;
 const area=document.getElementById("quizArea"); if(!area) return;
 const qs=[...area.querySelectorAll(".q")];
 const missing=qs.filter(q=>!q.querySelector(".opt.picked"));
 if(missing.length){
  qs.forEach(q=>q.classList.toggle("unanswered",!q.querySelector(".opt.picked")));
  const note=document.getElementById("quizNote");
  if(note){ note.textContent="ยังไม่ได้ตอบอีก "+missing.length+" ข้อ (ข้อ "+missing.map(q=>+q.dataset.i+1).join(", ")+") — ตอบให้ครบก่อนส่งนะ"; note.classList.add("show"); }
  missing[0].scrollIntoView({behavior:"smooth",block:"center"});
  return;
 }
 qzSubmitted=true;
 let score=0;
 qs.forEach(q=>{
  const correct=q.dataset.correct;
  const picked=q.querySelector(".opt.picked");
  const letter=picked.dataset.l;
  const ok=letter===correct;
  if(ok) score++;
  q.classList.add(ok?"is-right":"is-wrong");
  q.querySelectorAll(".opt").forEach(b=>{
   b.disabled=true;
   b.classList.remove("picked");
   if(b.dataset.l===correct) b.classList.add("right");
   else if(b===picked) b.classList.add("wrong");
  });
  const ans=q.querySelector(".answer");
  ans.style.display="block";
  ans.textContent=ok?"✅ ถูกต้อง!":"❌ ยังไม่ถูก — เฉลยคือ "+correct;
  ans.style.color=ok?"#15803d":"#dc2626";
 });
 const total=qs.length;
 const sc=document.getElementById("qbScore");
 if(sc){
  sc.className="qb-score "+(score/total>=0.5?"done":"low");
  sc.innerHTML='<small>คะแนน</small><b>'+score+' / '+total+'</b>';
 }
 const sub=document.getElementById("qbSubmit"); if(sub) sub.disabled=true;
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function qzScrollTo(id){
 const el=document.getElementById(id); if(!el) return;
 const y=el.getBoundingClientRect().top+window.pageYOffset-84;
 window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
}
function resetQuiz(){
 if(qzCurrent===null) return;
 renderQuiz(qzCurrent);
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function openMenu(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}

/* ===== Quiz chapter popup (shared) ===== */
let qzCurrent=null;
let qzSubmitted=false;
let qzByKey=false;
function qzIcon(n){
  const last=quizBanks.length-1;
  if(n===last) return "🎯";
  const pool=(typeof quizIcons!=="undefined"&&quizIcons)||["📘","📗","📙","📕","📒","📓","📔"];
  return pool[n%pool.length];
}
function qzEnsureModal(){
  let m=document.getElementById("qzModal");
  if(m) return m;
  m=document.createElement("div");
  m.id="qzModal";
  m.setAttribute("role","dialog");
  m.setAttribute("aria-modal","true");
  m.setAttribute("aria-labelledby","qzTitle");
  m.innerHTML=`<div class="qz-back" onclick="closeQuizPicker()"></div>
   <div class="qz-box">
    <div class="qz-head">
      <div class="qz-head-ico">📝</div>
      <div><h4 id="qzTitle">📚 เลือกบทที่จะฝึก</h4><small>แตะบทที่ต้องการ แล้วโจทย์จะขึ้นให้ทันที</small></div>
      <button type="button" class="qz-x" aria-label="ปิด" onclick="closeQuizPicker()">×</button>
    </div>
    <div class="qz-list" id="qzList"></div>
   </div>`;
  document.body.appendChild(m);
  return m;
}
function openQuizPicker(ev){
  qzByKey=!!(ev&&ev.detail===0);
  const m=qzEnsureModal();
  const last=quizBanks.length-1;
  document.getElementById("qzList").innerHTML=quizBanks.map((b,n)=>{
    const isAll=n===last;
    const name=String(b.label).replace(/^\d+\.\s*/,"");
    return `<button type="button" class="qz-item${isAll?" all":""}${n===qzCurrent?" active":""}" onclick="pickQuiz(${n})">
      <span class="qz-i">${qzIcon(n)}</span>
      <span class="qz-t"><span class="qz-n">${name}</span><span class="qz-c">${b.questions.length} ข้อ · ${isAll?"ทบทวนรวม":"ฝึกเฉพาะบท"}</span></span>
      <span class="qz-ok">✓</span>
    </button>`;
  }).join("");
  m.classList.add("show");
  document.body.classList.add("qz-lock"); document.documentElement.classList.add("qz-lock");
  const act=m.querySelector(".qz-item.active")||m.querySelector(".qz-item");
  if(act){ act.focus({preventScroll:true}); act.scrollIntoView({block:"nearest"}); }
}
function closeQuizPicker(){
  const m=document.getElementById("qzModal");
  if(m) m.classList.remove("show");
  document.body.classList.remove("qz-lock"); document.documentElement.classList.remove("qz-lock");
  const b=document.getElementById("quizPickBtn"); if(b&&qzByKey) b.focus({preventScroll:true});
  qzByKey=false;
}
function pickQuiz(n){
  renderQuiz(n);
  closeQuizPicker();
  const a=document.getElementById("quizArea");
  if(a) setTimeout(()=>a.scrollIntoView({behavior:"smooth",block:"start"}),60);
}



/* keep wheel / touch scrolling working inside the popup, never on the page behind */
document.addEventListener("wheel",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList");
  if(list && list.contains(e.target)) return;      // native scroll inside the list
  e.preventDefault();
  if(list) list.scrollTop += e.deltaY;              // wheel on backdrop/header -> scroll the list
},{passive:false});
document.addEventListener("keydown",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList"); if(!list) return;
  const step={ArrowDown:60,ArrowUp:-60,PageDown:list.clientHeight*0.9,PageUp:-list.clientHeight*0.9}[e.key];
  if(step!==undefined){ e.preventDefault(); list.scrollTop+=step; }
  else if(e.key==="Home"){ e.preventDefault(); list.scrollTop=0; }
  else if(e.key==="End"){ e.preventDefault(); list.scrollTop=list.scrollHeight; }
});

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=document.getElementById("qzModal"); if(m&&m.classList.contains("show")) closeQuizPicker(); }});

showTopic(0);
</script>
