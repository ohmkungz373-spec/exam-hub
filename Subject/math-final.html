 bc และ c ≠ 0 แล้ว a = b"]], ["จับคู่ตัวอย่าง ↔ สมบัติ", [], "<div class=\"tt-wrap\"><table class=\"tt tt-map\"><thead><tr><th>ตัวอย่าง</th><th>สมบัติ</th></tr></thead><tbody><tr><td>3 + 5 = 5 + 3</td><td>สลับที่</td></tr><tr><td>3 + (4 + 5) = (3 + 4) + 5</td><td>เปลี่ยนหมู่</td></tr><tr><td>7 + 0 = 7</td><td>เอกลักษณ์การบวก</td></tr><tr><td>7 × 1 = 7</td><td>เอกลักษณ์การคูณ</td></tr><tr><td>5 + (−5) = 0</td><td>ตัวผกผันการบวก</td></tr><tr><td>4 × (1/4) = 1</td><td>ตัวผกผันการคูณ</td></tr><tr><td>2(x + 3) = 2x + 6</td><td>แจกแจง</td></tr></tbody></table></div>"]], "note": "0 ไม่มีตัวผกผันการคูณ (1/0 หาค่าไม่ได้) และการตัดออกสำหรับการคูณต้องมีเงื่อนไข c ≠ 0 — สองจุดนี้ข้อสอบชอบถาม"}, {"title": "สัมประสิทธิ์ของพหุนาม", "part": "ส่วนที่ 1 · จำนวนจริงและพหุนาม (10 ข้อ)", "sub": "บทย่อย: ดีกรี · สัมประสิทธิ์ · การคูณกระจาย · ทางลัด", "intro": "ให้คูณพหุนามสองตัวแล้วถามสัมประสิทธิ์ของพจน์ที่กำหนด — คูณกระจายให้ครบ แล้วรวมพจน์ที่ดีกรีเท่ากัน", "sections": [["คำศัพท์", ["<b>ดีกรี</b> = เลขชี้กำลังสูงสุดของตัวแปร", "<b>สัมประสิทธิ์</b> = ตัวเลขที่อยู่หน้าตัวแปร (เช่น ใน −5x สัมประสิทธิ์คือ −5)"]], ["วิธีหาสัมประสิทธิ์", ["<strong>คูณกระจายทุกพจน์ให้ครบ</strong>", "<strong>รวมพจน์ที่มีดีกรีเท่ากัน</strong>", "<strong>อ่านสัมประสิทธิ์ของพจน์ที่โจทย์ถาม</strong>"]], ["ตัวอย่าง: (x + 2)(x² − 3x + 1)", [], "<div class=\"formula\">x·(x² − 3x + 1) = x³ − 3x² + x\n2·(x² − 3x + 1) = 2x² − 6x + 2\nรวมกัน: x³ + (−3 + 2)x² + (1 − 6)x + 2\n       = x³ − x² − 5x + 2\n∴ สัมประสิทธิ์ของ x² = −1</div>"], ["ทางลัด (ถามแค่พจน์เดียว)", ["<strong>ไม่ต้องกระจายทั้งหมด</strong> — คูณเฉพาะคู่ที่ให้ผลเป็นพจน์ที่ถาม แล้วบวกกัน", "จากตัวอย่างข้างบน x² มาจาก x·(−3x) = −3x² และ 2·x² = 2x² → −3 + 2 = <b>−1</b>"]]], "note": "ระวังเครื่องหมายลบตอนคูณกระจาย และอย่าลืมรวมทุกพจน์ที่ดีกรีเท่ากัน (เช่น −3x² กับ +2x²)"}, {"title": "แยกตัวประกอบพหุนามดีกรี 2", "part": "ส่วนที่ 1 · จำนวนจริงและพหุนาม (10 ข้อ)", "sub": "บทย่อย: ดึงตัวร่วม · กำลังสองสมบูรณ์ · ผลต่างกำลังสอง · ax² + bx + c", "intro": "ทำตามลำดับ: ดึงตัวร่วมก่อนเสมอ → ดูว่าเข้ารูปสูตรไหน → แยกให้สุดทาง", "sections": [["สูตรที่ต้องจำ", ["<strong>a² + 2ab + b²</strong> = (a + b)²", "<strong>a² − 2ab + b²</strong> = (a − b)²", "<strong>a² − b²</strong> = (a − b)(a + b)", "<strong>x² + (p + q)x + pq</strong> = (x + p)(x + q)"]], ["รูปแบบ ax² + bx + c", ["หาเลข 2 ตัวที่ <b>คูณกันได้ ac</b> และ <b>บวกกันได้ b</b>", "<strong>ตัวอย่าง 2x² + 7x + 3 → ac</strong> = 6, b = 7 → เลข 1 กับ 6", "แยกพจน์กลาง: 2x² + x + 6x + 3 = x(2x + 1) + 3(2x + 1) = <b>(2x + 1)(x + 3)</b>"]], ["ตัวอย่างเพิ่มเติม", ["<strong>x² + 5x + 6</strong> = (x + 2)(x + 3)  (2 × 3 = 6, 2 + 3 = 5)", "<strong>x² − 5x − 6</strong> = (x − 6)(x + 1)  (−6 × 1 = −6, −6 + 1 = −5)", "<strong>3x² − 12</strong> = 3(x² − 4) = 3(x − 2)(x + 2)  (ดึงตัวร่วม 3 ก่อน)"]]], "note": "ดึงตัวร่วมก่อนเสมอ | <strong>แยกให้สุดทาง</strong> — เช่น x² − 4 ยังแยกต่อได้เป็น (x − 2)(x + 2)"}, {"title": "แยกตัวประกอบพหุนามดีกรี 3", "part": "ส่วนที่ 1 · จำนวนจริงและพหุนาม (10 ข้อ)", "sub": "บทย่อย: ผลบวก/ผลต่างกำลังสาม · จัดกลุ่ม · ทฤษฎีบทตัวประกอบ", "intro": "พหุนามดีกรี 3 อย่างง่ายแยกได้ 3 แนวทาง: ใช้สูตร a³ ± b³, จัดกลุ่ม (4 พจน์) หรือลองแทนค่าเพื่อหาตัวประกอบ", "sections": [["สูตรผลบวก/ผลต่างกำลังสาม", ["<strong>a³ + b³</strong> = (a + b)(a² − ab + b²)", "<strong>a³ − b³</strong> = (a − b)(a² + ab + b²)", "<strong>ช่วยจำเครื่องหมาย</strong>: ตัวหน้าเหมือนโจทย์ · ตัวกลางตรงข้าม · ตัวท้ายเป็นบวกเสมอ", "<strong>x³ + 8</strong> = x³ + 2³ = (x + 2)(x² − 2x + 4)", "<strong>x³ − 27</strong> = x³ − 3³ = (x − 3)(x² + 3x + 9)"]], ["จัดกลุ่ม (พหุนาม 4 พจน์)", ["<strong>x³ − x² − 4x + 4</strong> = x²(x − 1) − 4(x − 1)", "<strong>= (x − 1)(x² − 4)</strong>", "= <b>(x − 1)(x − 2)(x + 2)</b>"]], ["ทฤษฎีบทตัวประกอบ", ["<strong>ถ้า P(c)</strong> = 0 แล้ว (x − c) เป็นตัวประกอบของ P(x)", "ลองแทน ±1, ±2 จนได้ค่าเป็น 0 แล้วนำ (x − c) ไปหาร จากนั้นแยกส่วนที่เหลือต่อ", "<strong>ตัวอย่าง: P(x)</strong> = x³ − 6x² + 11x − 6 → P(1) = 0 → (x − 1)(x² − 5x + 6) = (x − 1)(x − 2)(x − 3)"]]], "note": "แยกให้สุดทาง const menu=document.getElementById("menuList");
function buildMenu(list=topics){
 menu.innerHTML="";
 let lastPart="";
 list.forEach((t)=>{
   const original=topics.indexOf(t);
   const title=t.title.trim();

   // ใช้โครงสร้างหมวดบทแบบเดียวกับวิชาอื่น แต่คงชื่อ Part ของ English ไว้
   let part=t.part ? t.part : (title.includes("·") ? title.split("·")[0].trim() : "");
   if(title.toUpperCase().startsWith("MINI QUIZ")) part="Quiz";

   if(part!==lastPart){
     const label=document.createElement("div");
     label.className="menu-section";
     label.textContent=part || "เนื้อหาทั้งหมด";
     menu.appendChild(label);
     lastPart=part;
   }

   const b=document.createElement("button");
   b.className="topic-btn";
   b.dataset.topicIndex=original;

   const cleanTitle=title.includes("·")
     ? title.split("·").slice(1).join("·").trim()
     : title;
   const cleanSub=(t.sub||"").replace(/^บทย่อย:\s*/,"").trim();

   b.innerHTML=`<span class="topic-num">${String(original+1).padStart(2,"0")}</span>
   <span class="topic-copy">
     <span class="topic-label">${cleanTitle}</span>
     <span class="topic-sub">${cleanSub}</span>
   </span>
   <span class="topic-arrow">›</span>`;

   b.onclick=()=>{showTopic(original);closeMenu()};
   menu.appendChild(b);
 });
}
buildMenu();

function filterMenu(){
 const q=document.getElementById("search").value.toLowerCase();
 buildMenu(topics.filter(t=>(t.title+" "+t.sub+" "+t.intro).toLowerCase().includes(q)));
}

function showTopic(i){
 const t=topics[i];
 let body="";
 if(t.sections && t.sections.length){
  t.sections.forEach(s=>{
   body+=`<section class="sec-card"><h3>${s[0]}</h3>${s[1]&&s[1].length?`<ul>${s[1].map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${s[2]||""}</section>`;
  });
 }
 let quiz="";
 if(i===topics.length-1){
  quiz=`<div class="quiz"><h3>📝 Quiz</h3>
   <div class="quiz-bar" id="quizBar"><button type="button" class="qb-reset" onclick="resetQuiz()">↺ ทำใหม่</button><div class="qb-score" id="qbScore"><small>คะแนน</small><b>– / –</b></div></div><button type="button" id="quizPickBtn" class="quiz-pick-btn" onclick="openQuizPicker(event)">
      <span class="qp-ico" id="qpIco">🎯</span>
      <span class="qp-txt"><span class="qp-lab">📚 เลือกบทฝึก</span><span class="qp-cur" id="qpCur">—</span><span class="qp-sub" id="qpSub"></span></span>
      <span class="qp-go">เลือกบท ▾</span>
    </button><div id="quizArea"></div>
   <p class="small">หมายเหตุ: คำถามอ้างอิงจากเนื้อหาที่สรุปไว้ในแต่ละบท</p></div>`;
 }
 document.getElementById("page").innerHTML=`
  <div class="topic-head">
   <div class="topic-no">${i+1}</div>
   <div><h2>${t.title}</h2>
   ${t.sub?`<div class="subtitle">${t.sub}</div>`:""}</div>
  </div>
  ${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${body}
  ${t.note?`<div class="note"><b>⭐ จุดที่ควรจำ</b><br>${t.note}</div>`:""}
  ${quiz}
  <div class="nav">
   <button onclick="showTopic(${i-1})" ${i===0?"disabled":""}>← บทก่อนหน้า</button>
   <button onclick="showTopic(${i+1})" ${i===topics.length-1?"disabled":""}>บทถัดไป →</button>
  </div>`;
 if(i===topics.length-1) renderQuiz(quizBanks.length-1);
 document.querySelectorAll(".topic-btn").forEach((b,n)=>{
  b.classList.toggle("active",n===i);
 });
 document.getElementById("progress").style.width=((i+1)/topics.length*100)+"%";
 document.getElementById("progressText").textContent="บท "+(i+1)+" / "+topics.length;
 window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuiz(bankIndex){
 const bank=quizBanks[bankIndex];
 if(!bank) return;
 qzCurrent=bankIndex;
 qzSubmitted=false;
 const curEl=document.getElementById("qpCur");
 if(curEl) curEl.textContent=String(bank.label).replace(/^\d+\.\s*/,"");
 const subEl=document.getElementById("qpSub");
 if(subEl) subEl.textContent=bank.questions.length+" ข้อ · "+(bankIndex===quizBanks.length-1?"ทบทวนรวม":"ฝึกเฉพาะบท");
 const icoEl=document.getElementById("qpIco");
 if(icoEl) icoEl.textContent=qzIcon(bankIndex);
 const area=document.getElementById("quizArea");
 if(!area) return;
 const L=["A","B","C","D"];
 area.innerHTML=bank.questions.map((q,n)=>`
  <div class="q" data-i="${n}" data-correct="${q[5]}">
   <b>${n+1}) ${q[0]}</b>
   ${L.map((l,k)=>`<button type="button" class="opt" data-l="${l}" onclick="pickAnswer(this)">${l}. ${q[k+1]}</button>`).join("")}
   <div class="answer"></div>
  </div>`).join("")+`
  <div class="quiz-submit-wrap">
   <div class="quiz-note" id="quizNote"></div>
   <button type="button" class="qb-submit" id="qbSubmit" onclick="submitQuiz()">ส่งคำตอบ</button>
  </div>`;
 qzUpdateBar();
}
function pickAnswer(btn){
 if(qzSubmitted) return;
 const box=btn.closest(".q");
 box.classList.remove("unanswered");
 box.querySelectorAll(".opt").forEach(b=>b.classList.remove("picked"));
 btn.classList.add("picked");
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzUpdateBar();
}
function qzUpdateBar(){
 const area=document.getElementById("quizArea"); if(!area) return;
 const total=area.querySelectorAll(".q").length;
 const answered=area.querySelectorAll(".opt.picked").length;
 const sub=document.getElementById("qbSubmit");
 const sc=document.getElementById("qbScore");
 if(qzSubmitted) return;
 if(sub) sub.disabled=false;
 if(sc){
  sc.className="qb-score";
  sc.innerHTML='<small>ตอบแล้ว</small><b>'+answered+' / '+total+'</b>';
 }
}

 const area=document.getElementById("quizArea"); if(!area) return;
 const qs=[...area.querySelectorAll(".q")];
 const missing=qs.filter(q=>!q.querySelector(".opt.picked"));
 if(missing.length){
  qs.forEach(q=>q.classList.toggle("unanswered",!q.querySelector(".opt.picked")));
  const note=document.getElementById("quizNote");
  if(note){ note.textContent="ยังไม่ได้ตอบอีก "+missing.length+" ข้อ (ข้อ "+missing.map(q=>+q.dataset.i+1).join(", ")+") — ตอบให้ครบก่อนส่งนะ"; note.classList.add("show"); }
  missing[0].scrollIntoView({behavior:"smooth",block:"center"});
  return;
 }
 qzSubmitted=true;
 let score=0;
 qs.forEach(q=>{
  const correct=q.dataset.correct;
  const picked=q.querySelector(".opt.picked");
  const letter=picked.dataset.l;
  const ok=letter===correct;
  if(ok) score++;
  q.classList.add(ok?"is-right":"is-wrong");
  q.querySelectorAll(".opt").forEach(b=>{
   b.disabled=true;
   b.classList.remove("picked");
   if(b.dataset.l===correct) b.classList.add("right");
   else if(b===picked) b.classList.add("wrong");
  });
  const ans=q.querySelector(".answer");
  ans.style.display="block";
  ans.textContent=ok?"✅ ถูกต้อง!":"❌ ยังไม่ถูก — เฉลยคือ "+correct;
  ans.style.color=ok?"#15803d":"#dc2626";
 });
 const total=qs.length;
 const sc=document.getElementById("qbScore");
 if(sc){
  sc.className="qb-score "+(score/total>=0.5?"done":"low");
  sc.innerHTML='<small>คะแนน</small><b>'+score+' / '+total+'</b>';
 }
 const sub=document.getElementById("qbSubmit"); if(sub) sub.disabled=true;
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function qzScrollTo(id){
 const el=document.getElementById(id); if(!el) return;
 const y=el.getBoundingClientRect().top+window.pageYOffset-84;
 window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
}
function resetQuiz(){
 if(qzCurrent===null) return;
 renderQuiz(qzCurrent);
 const note=document.getElementById("quizNote"); if(note) note.classList.remove("show");
 qzScrollTo("quizBar");
}
function goHomeFromSubject(){ try { if(window.parent && window.parent !== window && typeof window.parent.goHome === "function"){ window.parent.goHome(); return; } } catch(e){} window.location.href = location.protocol==="file:" ? "index.html" : "/home"; }
function openMenu(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}

/* ===== Quiz chapter popup (shared) ===== */
let qzCurrent=null;
let qzSubmitted=false;
let qzByKey=false;
function qzIcon(n){
  const last=quizBanks.length-1;
  if(n===last) return "🎯";
  const pool=(typeof quizIcons!=="undefined"&&quizIcons)||["📘","📗","📙","📕","📒","📓","📔"];
  return pool[n%pool.length];
}
function qzEnsureModal(){
  let m=document.getElementById("qzModal");
  if(m) return m;
  m=document.createElement("div");
  m.id="qzModal";
  m.setAttribute("role","dialog");
  m.setAttribute("aria-modal","true");
  m.setAttribute("aria-labelledby","qzTitle");
  m.innerHTML=`<div class="qz-back" onclick="closeQuizPicker()"></div>
   <div class="qz-box">
    <div class="qz-head">
      <div class="qz-head-ico">📝</div>
      <div><h4 id="qzTitle">📚 เลือกบทที่จะฝึก</h4><small>แตะบทที่ต้องการ แล้วโจทย์จะขึ้นให้ทันที</small></div>
      <button type="button" class="qz-x" aria-label="ปิด" onclick="closeQuizPicker()">×</button>
    </div>
    <div class="qz-list" id="qzList"></div>
   </div>`;
  document.body.appendChild(m);
  return m;
}
function openQuizPicker(ev){
  qzByKey=!!(ev&&ev.detail===0);
  const m=qzEnsureModal();
  const last=quizBanks.length-1;
  document.getElementById("qzList").innerHTML=quizBanks.map((b,n)=>{
    const isAll=n===last;
    const name=String(b.label).replace(/^\d+\.\s*/,"");
    return `<button type="button" class="qz-item${isAll?" all":""}${n===qzCurrent?" active":""}" onclick="pickQuiz(${n})">
      <span class="qz-i">${qzIcon(n)}</span>
      <span class="qz-t"><span class="qz-n">${name}</span><span class="qz-c">${b.questions.length} ข้อ · ${isAll?"ทบทวนรวม":"ฝึกเฉพาะบท"}</span></span>
      <span class="qz-ok">✓</span>
    </button>`;
  }).join("");
  m.classList.add("show");
  document.body.classList.add("qz-lock"); document.documentElement.classList.add("qz-lock");
  const act=m.querySelector(".qz-item.active")||m.querySelector(".qz-item");
  if(act){ act.focus({preventScroll:true}); act.scrollIntoView({block:"nearest"}); }
}
function closeQuizPicker(){
  const m=document.getElementById("qzModal");
  if(m) m.classList.remove("show");
  document.body.classList.remove("qz-lock"); document.documentElement.classList.remove("qz-lock");
  const b=document.getElementById("quizPickBtn"); if(b&&qzByKey) b.focus({preventScroll:true});
  qzByKey=false;
}
function pickQuiz(n){
  renderQuiz(n);
  closeQuizPicker();
  const a=document.getElementById("quizArea");
  if(a) setTimeout(()=>a.scrollIntoView({behavior:"smooth",block:"start"}),60);
}



/* keep wheel / touch scrolling working inside the popup, never on the page behind */
document.addEventListener("wheel",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList");
  if(list && list.contains(e.target)) return;      // native scroll inside the list
  e.preventDefault();
  if(list) list.scrollTop += e.deltaY;              // wheel on backdrop/header -> scroll the list
},{passive:false});
document.addEventListener("keydown",function(e){
  const m=document.getElementById("qzModal");
  if(!m||!m.classList.contains("show")) return;
  const list=document.getElementById("qzList"); if(!list) return;
  const step={ArrowDown:60,ArrowUp:-60,PageDown:list.clientHeight*0.9,PageUp:-list.clientHeight*0.9}[e.key];
  if(step!==undefined){ e.preventDefault(); list.scrollTop+=step; }
  else if(e.key==="Home"){ e.preventDefault(); list.scrollTop=0; }
  else if(e.key==="End"){ e.preventDefault(); list.scrollTop=list.scrollHeight; }
});

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=document.getElementById("qzModal"); if(m&&m.classList.contains("show")) closeQuizPicker(); }});

showTopic(0);
</script>
